# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators. An empty include list would mean all tracked
# files.
#
# Rust, shell, Python, JavaScript, and protobuf definitions are the
# executable artifacts; the YAML is executable in practice (the CI
# workflows decide what runs, with which permissions, against which
# secrets, plus the actionlint and pre-commit configuration that
# constrains them); the Markdown documentation (READMEs,
# ARCHITECTURE, AGENTS, docs/ guides, and the workflow templates) is
# included too, since docs drift out of sync just as quietly as code
# and benefit from periodic re-reading.
#
# .devcontainer/ is included whole, by directory rather than by
# extension, because it is the build environment rather than a file
# type: the Dockerfiles pin the toolchain and install the system
# dependencies that both local `make` targets and the self-hosted
# Linux CI jobs build inside, and devcontainer.json decides what is
# mounted into that container and with which privileges. That makes
# it executable in the same practical sense as the CI YAML, and it
# is small enough that reviewing the directory outright is cheaper
# than maintaining a list of the file types that happen to be in it.
#
# docs/plans/ is excluded: plan files are point-in-time records of
# intended work, not living artifacts, and would swamp the queue.
# That covers docs/plans/order.yml as well. protoc output (*_pb2*
# Python modules and stubs) is generated, so reviewing it would
# attest to the generator's output rather than to anything a human
# wrote.
include = [
    '*.rs', '*.sh', '*.py', '*.pyi', '*.js', '*.proto', '*.md', '*.yml', '*.yaml',
    '.devcontainer/*',
]
exclude = [
    'docs/plans/*',
    '*_pb2.py',
    '*_pb2.pyi',
    '*_pb2_grpc.py',
    '*_pb2_grpc.pyi',
]
