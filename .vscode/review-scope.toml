# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators. An empty include list would mean all tracked
# files.
#
# Rust, shell, and Python are the executable artifacts; the YAML is
# executable in practice (the CI workflows decide what runs, with
# which permissions, against which secrets, plus the actionlint and
# pre-commit configuration that constrains them); the Markdown
# documentation (READMEs, ARCHITECTURE, AGENTS, docs/ guides, and the
# workflow templates) is included too, since docs drift out of sync
# just as quietly as code and benefit from periodic re-reading.
#
# docs/plans/ is excluded: plan files are point-in-time records of
# intended work, not living artifacts, and would swamp the queue.
# That covers docs/plans/order.yml as well.
include = ['*.rs', '*.sh', '*.py', '*.md', '*.yml', '*.yaml']
exclude = ['docs/plans/*']
