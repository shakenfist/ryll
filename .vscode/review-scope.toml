# Which files are subject to whole-file review (see
# shakenfist/development docs/code-review-tracking.md). Patterns are
# fnmatch-style against repo-relative paths; '*' matches across
# directory separators. An empty include list would mean all tracked
# files.
#
# Rust, shell, Python, JavaScript, and protobuf definitions are the
# executable artifacts; the YAML is executable in practice (the CI
# workflows decide what runs, with which permissions, against which
# secrets, plus the actionlint and pre-commit configuration that
# constrains them); the Markdown documentation (READMEs,
# ARCHITECTURE, AGENTS, docs/ guides, and the workflow templates) is
# included too, since docs drift out of sync just as quietly as code
# and benefit from periodic re-reading.
#
# TOML, JSON and the Makefile are the configuration that decides what
# the executable artifacts are built from and what is allowed into
# them: the Cargo manifests name every dependency, deny.toml and
# .cargo/audit.toml decide which advisories and licences are
# tolerated, clippy.toml tunes the lints, renovate.json decides what
# updates arrive unattended, and the Makefile is the entry point
# every local and CI build goes through. A dependency added to a
# manifest is as consequential as a line of code and is reviewed as
# one.
#
# HTML, CSS, Ruby and the systemd unit are the artifacts served to or
# run by somebody else: the web assets reach a browser, the Homebrew
# formula runs on an installing user's machine, and ryll-web.service
# decides the privileges the daemon runs with. .gitignore is included
# because what it hides is a security property -- a pattern that
# silently swallows a credentials file is invisible until it is not.
#
# .devcontainer/ is included whole, by directory rather than by
# extension, because it is the build environment rather than a file
# type: the Dockerfiles pin the toolchain and install the system
# dependencies that both local `make` targets and the self-hosted
# Linux CI jobs build inside, and devcontainer.json decides what is
# mounted into that container and with which privileges. That makes
# it executable in the same practical sense as the CI YAML, and it
# is small enough that reviewing the directory outright is cheaper
# than maintaining a list of the file types that happen to be in it.
#
# docs/plans/ is excluded: plan files are point-in-time records of
# intended work, not living artifacts, and would swamp the queue.
# That covers docs/plans/order.yml as well. protoc output (*_pb2*
# Python modules and stubs) is generated, so reviewing it would
# attest to the generator's output rather than to anything a human
# wrote.
#
# The rest of the excludes are files whose content no human decides,
# and a review mark on one of those attests to nothing:
#
# - ryll/src/web/assets/sfui/ is vendored verbatim from
#   shakenfist/sfui by that repository's tools/vendor.sh. Reviewing
#   the copy is reviewing the wrong tree -- a finding here has to be
#   fixed upstream and re-vendored, or the next sync discards it --
#   and the copy already has a drift check of its own, the
#   sfui-vendor consistency audit, which is a stronger guarantee than
#   a review mark because it re-verifies on every audit run rather
#   than once.
# - Cargo.lock (both workspaces) is rewritten by cargo and by
#   Renovate. The decisions in it are made in the manifests, which
#   are in scope.
# - .github/exported-config/ is a snapshot of this repository's
#   GitHub settings, written by export-repo-config.yml. It is a
#   record of state configured in the GitHub UI, not an input to
#   anything.
# - LICENSE is verbatim upstream licence text.
# - The compression test fixtures are binary, generated by
#   tools/gen-swatches-jpeg, whose source is in scope.
include = [
    '*.rs', '*.sh', '*.py', '*.pyi', '*.js', '*.proto', '*.md', '*.yml', '*.yaml',
    '*.toml', '*.json', '*.html', '*.css', '*.rb', '*.service', '*.gitignore',
    'Makefile',
    '.devcontainer/*',
]
exclude = [
    'docs/plans/*',
    '*_pb2.py',
    '*_pb2.pyi',
    '*_pb2_grpc.py',
    '*_pb2_grpc.pyi',
    'ryll/src/web/assets/sfui/*',
    '*Cargo.lock',
    '.github/exported-config/*',
    'LICENSE',
    'shakenfist-spice-compression/tests/fixtures/*',
]
