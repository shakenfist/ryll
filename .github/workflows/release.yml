# Release workflow for Ryll
#
# Triggers on version tags (v*), which tools/tag-release.sh pushes once
# the version bump from tools/propose-release.sh has merged through the
# merge queue. Nothing is signed or published unless CI passed on the
# tagged commit and a reviewer approves the 'release' environment.
#
# Every job outside the marked build section is the same in every Rust
# repository. The build section holds ryll's own build and publish jobs.
# See docs/releasing.md for the release process.
#
# Template source: shakenfist/development/templates/release-automation-rust/

name: Release

permissions: {}

on:
  push:
    tags:
      - 'v*'

  # A dry run of the build, on any ref: it runs check-version and the
  # build jobs, and every job with an effect outside the run is skipped.
  workflow_dispatch:

# One run per ref at a time, never cancelled part way: a release that has
# signed its tag or begun publishing must finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Fails the release unless the named CI workflows succeeded on the
  # tagged commit, so that nothing is signed or published from code CI
  # did not pass. It carries the same push and tag guard as the
  # publishing jobs, so a workflow_dispatch dry run skips it and still
  # exercises the build. See docs/releasing.md for what counts as CI, and
  # https://github.com/shakenfist/actions/blob/main/docs/actions.md
  # (the require-ci-success section) for how the gate works.
  ci-gate:
    name: Require CI success on the tagged commit
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, static]

    permissions:
      actions: read
      contents: read

    steps:
      - name: Require CI success
        uses: shakenfist/actions/require-ci-success@main
        # A few API calls per commit, at most 21 commits, and up to
        # five pages of the default branch's history.
        timeout-minutes: 5
        with:
          workflows: |
            ci.yml

  # The root of the build graph: every other job needs this one, directly
  # or through a job that does, so the gate sits upstream of all of them.
  # A skipped ci-gate would otherwise skip this job too, so the guard lets
  # a skipped gate through, but only on a run that publishes nothing. A
  # tag push always runs the gate, and this job then needs its success. A
  # workflow_dispatch skips the gate by design, and never reaches a
  # publishing job. The ${{ }} wrapper is required: YAML reads a bare
  # value starting with "!" as a tag.
  #
  # The tag must name the version the tree carries, and Cargo.lock must
  # agree with it, because the release builds from the lockfile. All six
  # crates inherit [workspace.package]'s version, so the root Cargo.toml
  # is authoritative. On a dry run with no tag there is nothing to compare
  # with, and the script checks only that the two files agree.
  check-version:
    name: Check the version matches the tag
    needs: ci-gate
    if: >-
      ${{ !cancelled() && (needs.ci-gate.result == 'success' ||
      (github.event_name != 'push' && needs.ci-gate.result == 'skipped')) }}
    runs-on: [self-hosted, static]
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the version
        run: tools/release-version.sh check "${GITHUB_REF}"

  # ---------------------------------------------------------------------
  # BEGIN repository build and publish jobs.
  #
  # The constraints on this section, from the template:
  #
  # - every build job needs check-version, directly or through another
  #   build job, and carries an if: like build-linux's: !cancelled()
  #   and a needs.<job>.result == 'success' clause for each job in its
  #   needs, with no always() and nothing else;
  # - every build job is listed in sign-tag's needs, so the tag is never
  #   signed while a build is running or after one has failed;
  # - an artifact whose name starts with release- is one github-release
  #   attaches to the GitHub release, and no other artifact is;
  # - a job that builds a Python wheel runs check-dist on it before
  #   uploading it;
  # - every publishing job needs sign-tag, carries the push and tag
  #   guard, and holds only the permissions its registry needs.
  # ---------------------------------------------------------------------

  # Linux x86_64 release builds run on a self-hosted runner inside
  # the devcontainer via the Makefile, so this job's steps differ
  # enough from the GitHub-hosted matrix below to warrant a
  # separate job. The debian-13-docker image ships with docker.io
  # preinstalled (see supply-chain.yml).
  #
  # The if: is needed for the workflow_dispatch dry run. A job with no
  # if: of its own runs only if every job upstream of it succeeded, not
  # just the ones it names in needs, so the skipped ci-gate would skip
  # this job even though check-version ran. Testing check-version's
  # result alone lets it run then, and on a tag push check-version
  # succeeds only after the gate did. A failed, skipped or cancelled
  # dependency still stops it.
  build-linux:
    name: Build (Linux x86_64)
    needs: check-version
    if: ${{ !cancelled() && needs.check-version.result == 'success' }}
    runs-on: [self-hosted, vm, debian-13-docker, l]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Must stay directly after checkout; see the action for why.
      - uses: ./.github/actions/cargo-cache

      - name: Build
        run: make release

      - name: Run tests
        run: make test

      # The crates.io publish cannot be undone, and publishes one crate
      # at a time, so check that every crate packages and builds from
      # its tarball before sign-tag (which needs this job) lets
      # publish-crates start. See the package-check target.
      - name: Package and verify the crates
        run: make package-check

      - name: Build .deb package
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-x86_64-unknown-linux-gnu
          path: target/debian/*.deb

      - name: Build .rpm package
        run: make rpm

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-rpm-x86_64-unknown-linux-gnu
          path: target/generate-rpm/*.rpm

  # These platforms stay on GitHub-hosted runners: we own no macOS,
  # Windows, or aarch64 Linux hardware, and this is a public
  # repository so GitHub-hosted runner minutes are free. See
  # build-linux for why it carries this if:.
  build:
    name: Build (${{ matrix.name }})
    needs: check-version
    if: ${{ !cancelled() && needs.check-version.result == 'success' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (aarch64)
            # audit-ok: github-hosted-runner -- no self-hosted aarch64 Linux hardware
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ""
          - name: macOS (aarch64)
            # audit-ok: github-hosted-runner -- no self-hosted macOS hardware
            os: macos-latest
            target: aarch64-apple-darwin
            features: ""
          - name: Windows (x86_64)
            # audit-ok: github-hosted-runner -- no self-hosted Windows hardware
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # Windows drops only `capture` (pcap-file / etherparse /
            # mp4 do not build here). --no-default-features also
            # turns off gui and audio, so add those back explicitly.
            features: "--no-default-features --features ryll/gui,ryll/audio"
          - name: Windows (aarch64)
            # audit-ok: github-hosted-runner -- no self-hosted Windows hardware
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: "--no-default-features --features ryll/gui,ryll/audio"
    runs-on: ${{ matrix.os }}
    # A normal leg takes 10-20 minutes. Without a bound, a test that
    # hangs runs into GitHub's six-hour job ceiling instead (#330 did,
    # repeatedly, in ci.yml's copy of this job) and holds the release.
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # See ci.yml for rationale: CMake 4.x rejects libopus's bundled
      # cmake_minimum_required(VERSION <3.5); this policy override lets
      # the audiopus_sys source-build path keep working on macOS/Windows.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # The version the tree carries, which check-version has already
      # matched against the tag on a release. A workflow_dispatch dry run
      # has no tag, and this still names its tarball and zip sensibly.
      - name: Get version
        shell: bash
        run: echo "VERSION=$(tools/release-version.sh get)" >> "$GITHUB_ENV"

      # On Linux we install libopus-dev so audiopus_sys (the opus crate)
      # dynamic-links to libopus.so.0; cargo-deb's $auto then records
      # libopus0 as a runtime dep in the generated .deb. On macOS and
      # Windows we do not install opus via brew/vcpkg — audiopus_sys
      # falls back to building libopus from source (bundled vendor),
      # producing a self-contained binary with no runtime opus dep.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb1-dev \
            libx11-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libssl-dev \
            libasound2-dev \
            libopus-dev

      - name: Build
        run: cargo build --release -p ryll ${{ matrix.features }}

      - name: Run tests
        run: cargo test --workspace ${{ matrix.features }}

      # --- Linux: .deb and .rpm ---

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: runner.os == 'Linux'
        run: cargo deb --no-build -p ryll

      - name: Upload .deb artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ matrix.target }}
          path: target/debian/*.deb

      - name: Install cargo-generate-rpm
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm package
        if: runner.os == 'Linux'
        run: cargo generate-rpm -p ryll

      - name: Upload .rpm artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-rpm-${{ matrix.target }}
          path: target/generate-rpm/*.rpm

      # --- macOS: tarball ---

      - name: Create macOS tarball
        if: runner.os == 'macOS'
        run: |
          cd target/release
          tar czf "ryll-${VERSION}-${{ matrix.target }}.tar.gz" ryll

      - name: Upload macOS tarball
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: target/release/ryll-*.tar.gz

      # --- Windows: zip ---

      - name: Create Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target\release\ryll.exe `
            -DestinationPath "target\release\ryll-${{ env.VERSION }}-${{ matrix.target }}.zip"

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.target }}
          path: target/release/ryll-*.zip

  # Builds the per-arch `ryll` PyPI wheels (maturin bindings=bin; the
  # wheel embeds the compiled ryll GUI binary, see
  # tools/build-ryll-wheel.sh and docs/plans/PLAN-pip-distribution.md).
  # Each leg must build natively on a runner matching its arch (no
  # QEMU), so it only needs check-version and can build in parallel
  # with the Rust jobs above. manual-build.yml carries a copy of this
  # matrix (its wheel-* platforms) so a branch can be tested before a
  # tag; keep the two in sync. See build-linux for why it carries this
  # if:.
  build-ryll-wheels:
    name: Build ryll wheel (${{ matrix.arch }})
    needs: check-version
    if: ${{ !cancelled() && needs.check-version.result == 'success' }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: [self-hosted, vm, debian-13-docker, l]
          - arch: aarch64
            # audit-ok: github-hosted-runner -- no self-hosted aarch64 Linux hardware, and the arm wheel must build natively, not under QEMU
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        run: tools/build-ryll-wheel.sh ${{ matrix.arch }}

      # Stops the release before anything is signed if the wheel carries
      # a test directory, or nothing outside its metadata.
      - name: Check the wheel contents
        timeout-minutes: 2
        uses: shakenfist/actions/check-dist@main
        with:
          path: target/wheels/

      - name: Upload ryll wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ryll-wheel-${{ matrix.arch }}
          path: target/wheels/*.whl

  publish-crates:
    name: Publish workspace crates to crates.io
    needs: [build, build-linux, sign-tag]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, vm, debian-13-docker, l]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Must stay directly after checkout; see the action for why. Its
      # own key prefix: `cargo publish` builds each crate to verify it,
      # with the network up and the cache writable, so what this job
      # saves must never become the read-only input to an isolated build.
      - uses: ./.github/actions/cargo-cache
        with:
          key-prefix: publish-cargo-cache

      # tools/publish-crates.sh publishes the six workspace crates
      # serially in dependency order inside the devcontainer. build-linux
      # has already packaged and verified all six (make package-check).
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make publish-crates

  # Publishes both per-arch wheels built by build-ryll-wheels to PyPI
  # via a Trusted Publisher (OIDC `id-token: write`), the same token-free
  # auth mechanism kerbside's release.yml uses for
  # `publish-proxy-pypi`/`publish-pypi` -- see
  # https://github.com/shakenfist/kerbside/blob/develop/.github/workflows/release.yml
  # and that repo's RELEASE-SETUP.md. This requires a `ryll`
  # trusted-publisher entry on pypi.org. Ordered after github-release
  # (needs:) so the release binaries are already public before this
  # version becomes `pip install`-able.
  #
  # We publish straight to PyPI with no TestPyPI staging, matching every
  # other Shaken Fist Python package. The wheel is already built and its
  # metadata validated at build time; a TestPyPI stage needs a second,
  # independent trusted-publisher config and, as a hard gate on the prod
  # publish, only adds a failure surface without de-risking the prod
  # path (different index, different config).
  publish-ryll-pypi:
    name: Publish ryll to PyPI
    needs: [build-ryll-wheels, github-release, sign-tag]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # pypa/gh-action-pypi-publish is a Docker container action, so it must
    # run on a Docker-capable runner (matching publish-crates), not the
    # static runner used by the JS-action jobs (github-release,
    # update-homebrew).
    runs-on: [self-hosted, vm, debian-13-docker, l]
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Checking out is what makes the workspace safe to use. This pool
      # is persistent and a job which skips checkout inherits whatever
      # the last job left behind, but checkout cleans with
      # "git clean -ffdx", which removes a stale gitignored dist/ before
      # the wheels are downloaded into it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download ryll wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ryll-wheel-*
          path: dist/
          merge-multiple: true

      - name: Generate attestations for artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  update-homebrew:
    name: Update Homebrew tap
    needs: github-release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Download macOS tarball from release
        run: |
          curl -sL -o ryll-macos.tar.gz \
            "https://github.com/shakenfist/ryll/releases/download/v${VERSION}/ryll-${VERSION}-aarch64-apple-darwin.tar.gz"

      - name: Compute SHA256
        run: |
          SHA=$(sha256sum ryll-macos.tar.gz | awk '{print $1}')
          echo "SHA256=${SHA}" >> "$GITHUB_ENV"
          echo "SHA256: ${SHA}"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/shakenfist/homebrew-tap.git"
          cd homebrew-tap
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/ryll.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Formula/ryll.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ryll.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update ryll to ${VERSION}"
          git push

  # ---------------------------------------------------------------------
  # END repository build and publish jobs.
  # ---------------------------------------------------------------------

  # Keyless Sigstore signing of the tag, gated on approval of the release
  # environment. Every publishing job needs this one, so nothing is
  # published until a reviewer approves, and it needs every build job, so
  # the tag is never re-pushed while a build is running or after one has
  # failed.
  #
  # The event is tested as well as the ref because a dispatch can be
  # aimed at a tag: the ref test alone passes there, and the run re-signs
  # and force-pushes a tag that already exists, rewriting a signed object
  # someone may already have verified. Nothing is lost by requiring push:
  # re-running a failed release goes through "Re-run jobs", which keeps
  # the original push event.
  sign-tag:
    name: Sign release tag with Sigstore
    needs: [build, build-linux, build-ryll-wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    # audit-ok: github-hosted-runner -- ephemeral runner for tag signing; installs gitsign via sudo and writes global git config, so it must be throwaway rather than the shared self-hosted pool
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sign and push the release tag
        run: tools/sign-release-tag.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

  # This job does not check out, and does not need to:
  # action-gh-release is a JavaScript action running on the host, so it
  # reads an absolute path happily. The static pool persists between jobs
  # and download-artifact extracts into its target rather than replacing
  # it, so the artefacts go to the per-job runner.temp, where nothing an
  # earlier job left can join the release.
  #
  # fail_on_unmatched_files is the other half: action-gh-release treats a
  # glob that matches nothing as a warning, so without it a release that
  # attached no files at all still reported success. Each of the four
  # globs below must match, which every release does: build-linux and
  # the build matrix's Linux leg give the .deb and .rpm files, and the
  # macOS and Windows legs the tarball and the zips.
  github-release:
    name: Create GitHub Release
    needs: [build, build-linux, sign-tag]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, static]
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Download release artefacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: ${{ runner.temp }}/dist/
          merge-multiple: true

      - name: List artifacts
        run: ls -la "${RUNNER_TEMP}/dist/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/dist/*.deb
            ${{ runner.temp }}/dist/*.rpm
            ${{ runner.temp }}/dist/*.tar.gz
            ${{ runner.temp }}/dist/*.zip
          fail_on_unmatched_files: true
