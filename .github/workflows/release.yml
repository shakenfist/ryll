name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  check-version:
    name: Verify version matches tag
    runs-on: [self-hosted, static]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Check version consistency
        id: check
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          EXPECTED="${TAG_NAME#v}"
          # All four crates inherit from [workspace.package].version,
          # so a single check on the root Cargo.toml is authoritative.
          ACTUAL=$(awk '
            /^\[workspace\.package\]/ { in_wp=1; next }
            /^\[/ { in_wp=0 }
            in_wp && /^version = / {
              gsub(/version = "|"/, "")
              print
              exit
            }
          ' Cargo.toml)
          echo "Tag: ${TAG_NAME}"
          echo "Expected version: ${EXPECTED}"
          echo "Workspace version: ${ACTUAL}"

          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            {
              echo "mismatch=true"
              echo "tag=${TAG_NAME}"
              echo "expected=${EXPECTED}"
              echo "actual=${ACTUAL}"
            } >> "$GITHUB_OUTPUT"
            echo "::error::Version mismatch: tag ${TAG_NAME} expects ${EXPECTED} but workspace Cargo.toml has ${ACTUAL}"
            exit 1
          fi

      - name: File issue on version mismatch
        if: failure() && steps.check.outputs.mismatch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Release ${{ steps.check.outputs.tag }}: workspace version mismatch" \
            --label "bug" \
            --body "The release workflow for tag \`${{ steps.check.outputs.tag }}\` failed because the workspace version does not match the tag.

          - **Tag expects:** ${{ steps.check.outputs.expected }}
          - **[workspace.package].version has:** ${{ steps.check.outputs.actual }}

          To fix: update \`version\` in \`[workspace.package]\` in the root \`Cargo.toml\`, commit, and re-tag. Normally this is done via \`make publish X.Y.Z\`.

          See the [failed workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details."

  # Linux x86_64 release builds run on a self-hosted runner inside
  # the devcontainer via the Makefile, so this job's steps differ
  # enough from the GitHub-hosted matrix below to warrant a
  # separate job. The debian-12-docker image ships with docker.io
  # preinstalled (see supply-chain.yml).
  build-linux:
    name: Build (Linux x86_64)
    needs: check-version
    runs-on: [self-hosted, vm, debian-12-docker, l]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Must stay directly after checkout; see the action for why.
      - uses: ./.github/actions/cargo-cache

      - name: Build
        run: make release

      - name: Run tests
        run: make test

      - name: Build .deb package
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-x86_64-unknown-linux-gnu
          path: target/debian/*.deb

      - name: Build .rpm package
        run: make rpm

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-rpm-x86_64-unknown-linux-gnu
          path: target/generate-rpm/*.rpm

  # These platforms stay on GitHub-hosted runners: we own no macOS,
  # Windows, or aarch64 Linux hardware, and this is a public
  # repository so GitHub-hosted runner minutes are free.
  build:
    name: Build (${{ matrix.name }})
    needs: check-version
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (aarch64)
            # audit-ok: github-hosted-runner -- no self-hosted aarch64 Linux hardware
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ""
          - name: macOS (aarch64)
            # audit-ok: github-hosted-runner -- no self-hosted macOS hardware
            os: macos-latest
            target: aarch64-apple-darwin
            features: ""
          - name: Windows (x86_64)
            # audit-ok: github-hosted-runner -- no self-hosted Windows hardware
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "--no-default-features"
          - name: Windows (aarch64)
            # audit-ok: github-hosted-runner -- no self-hosted Windows hardware
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: "--no-default-features"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # See ci.yml for rationale: CMake 4.x rejects libopus's bundled
      # cmake_minimum_required(VERSION <3.5); this policy override lets
      # the audiopus_sys source-build path keep working on macOS/Windows.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Get version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      # On Linux we install libopus-dev so audiopus_sys (the opus crate)
      # dynamic-links to libopus.so.0; cargo-deb's $auto then records
      # libopus0 as a runtime dep in the generated .deb. On macOS and
      # Windows we do not install opus via brew/vcpkg — audiopus_sys
      # falls back to building libopus from source (bundled vendor),
      # producing a self-contained binary with no runtime opus dep.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb1-dev \
            libx11-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libssl-dev \
            libasound2-dev \
            libopus-dev

      - name: Build
        run: cargo build --release -p ryll ${{ matrix.features }}

      - name: Run tests
        run: cargo test --workspace ${{ matrix.features }}

      # --- Linux: .deb and .rpm ---

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: runner.os == 'Linux'
        run: cargo deb --no-build -p ryll

      - name: Upload .deb artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-deb-${{ matrix.target }}
          path: target/debian/*.deb

      - name: Install cargo-generate-rpm
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm package
        if: runner.os == 'Linux'
        run: cargo generate-rpm -p ryll

      - name: Upload .rpm artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-rpm-${{ matrix.target }}
          path: target/generate-rpm/*.rpm

      # --- macOS: tarball ---

      - name: Create macOS tarball
        if: runner.os == 'macOS'
        run: |
          cd target/release
          tar czf "ryll-${VERSION}-${{ matrix.target }}.tar.gz" ryll

      - name: Upload macOS tarball
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: target/release/ryll-*.tar.gz

      # --- Windows: zip ---

      - name: Create Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target\release\ryll.exe `
            -DestinationPath "target\release\ryll-${{ env.VERSION }}-${{ matrix.target }}.zip"

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.target }}
          path: target/release/ryll-*.zip

  # Builds the per-arch `ryll` PyPI wheels (maturin bindings=bin; the
  # wheel embeds the compiled ryll GUI binary, see
  # tools/build-ryll-wheel.sh and docs/plans/PLAN-pip-distribution.md).
  # Each leg must build natively on a runner matching its arch (no
  # QEMU), so it only needs check-version and can build in parallel
  # with the Rust jobs above.
  build-ryll-wheels:
    name: Build ryll wheel (${{ matrix.arch }})
    needs: check-version
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: [self-hosted, vm, debian-12-docker, l]
          - arch: aarch64
            # audit-ok: github-hosted-runner -- no self-hosted aarch64
            # Linux hardware, and the arm wheel must build natively,
            # not under QEMU
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Build wheel
        run: tools/build-ryll-wheel.sh ${{ matrix.arch }}

      - name: Upload ryll wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: ryll-wheel-${{ matrix.arch }}
          path: target/wheels/*.whl

  # Keyless Sigstore-sign the release tag, gated on the `release`
  # environment's manual approval, mirroring kerbside's sign-tag job.
  # EVERY publishing job below needs this one, so the (approved) signed
  # tag exists before anything is published -- crates.io, the GitHub
  # release, and the ryll PyPI wheels alike. Gate on all artifact
  # builds so signing never becomes eligible (and the tag is never
  # force-pushed) while a build is still running or has failed.
  sign-tag:
    name: Sign release tag with Sigstore
    needs: [build, build-linux, build-ryll-wheels]
    # audit-ok: github-hosted-runner -- ephemeral runner for tag
    # signing; installs gitsign via sudo and writes global git config,
    # so it must be throwaway rather than the shared self-hosted pool
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sign and push release tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          tools/sign-release-tag.sh
          "${GITHUB_REF#refs/tags/}" "${GITHUB_SHA}"

  publish-crates:
    name: Publish workspace crates to crates.io
    needs: [build, build-linux, sign-tag]
    runs-on: [self-hosted, vm, debian-12-docker, l]
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # Must stay directly after checkout; see the action for why.
      - uses: ./.github/actions/cargo-cache

      # tools/publish-crates.sh publishes the six workspace crates
      # serially in dependency order inside the devcontainer.
      - name: Publish workspace crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: make publish-crates

  github-release:
    name: Create GitHub Release
    needs: [build, build-linux, sign-tag]
    runs-on: [self-hosted, static]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.deb
            *.rpm
            *.tar.gz
            *.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes both per-arch wheels built by build-ryll-wheels to PyPI
  # via a Trusted Publisher (OIDC `id-token: write`), the same token-free
  # auth mechanism kerbside's release.yml uses for
  # `publish-proxy-pypi`/`publish-pypi` -- see
  # https://github.com/shakenfist/kerbside/blob/develop/.github/workflows/release.yml
  # and that repo's RELEASE-SETUP.md. This requires a `ryll`
  # trusted-publisher entry on pypi.org. Ordered after github-release
  # (needs:) so the release binaries are already public before this
  # version becomes `pip install`-able.
  #
  # We publish straight to PyPI with no TestPyPI staging, matching every
  # other Shaken Fist Python package. The wheel is already built and its
  # metadata validated at build time; a TestPyPI stage needs a second,
  # independent trusted-publisher config and, as a hard gate on the prod
  # publish, only adds a failure surface without de-risking the prod
  # path (different index, different config).
  publish-ryll-pypi:
    name: Publish ryll to PyPI
    needs: [build-ryll-wheels, github-release, sign-tag]
    # pypa/gh-action-pypi-publish is a Docker container action, so it must
    # run on a Docker-capable runner (matching publish-crates), not the
    # static runner used by the JS-action jobs (github-release,
    # update-homebrew).
    runs-on: [self-hosted, vm, debian-12-docker, l]
    environment: release
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download ryll wheel artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: ryll-wheel-*
          path: dist/
          merge-multiple: true

      - name: Generate attestations for artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  update-homebrew:
    name: Update Homebrew tap
    needs: github-release
    runs-on: [self-hosted, static]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Get version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"

      - name: Download macOS tarball from release
        run: |
          curl -sL -o ryll-macos.tar.gz \
            "https://github.com/shakenfist/ryll/releases/download/v${VERSION}/ryll-${VERSION}-aarch64-apple-darwin.tar.gz"

      - name: Compute SHA256
        run: |
          SHA=$(sha256sum ryll-macos.tar.gz | awk '{print $1}')
          echo "SHA256=${SHA}" >> "$GITHUB_ENV"
          echo "SHA256: ${SHA}"

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/shakenfist/homebrew-tap.git"
          cd homebrew-tap
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/ryll.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Formula/ryll.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ryll.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update ryll to ${VERSION}"
          git push
