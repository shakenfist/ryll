name: CI

# Review-only changes (weaudit annotations and the rendered REVIEWS.md)
# cannot affect the build, so skip this workflow for them. Keep this
# list in sync with the .vscode whitelist in .gitignore and with
# codeql-analysis.yml. Safe because no status checks are required by
# branch protection — skipped workflows do not leave "expected" checks
# blocking the merge. The supply-chain workflow still runs: gitleaks
# and the bidi/zero-width scan check content, and review text is a
# place secrets or unicode smuggling could land.
on:
  push:
    branches: [develop]
    paths-ignore:
      - 'REVIEWS.md'
      - '.vscode/*.weaudit'
      - '.vscode/*.weaudit-shas.json'
      - '.vscode/review-scope.toml'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'REVIEWS.md'
      - '.vscode/*.weaudit'
      - '.vscode/*.weaudit-shas.json'
      - '.vscode/review-scope.toml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb1-dev \
            libx11-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libssl-dev \
            libasound2-dev \
            libopus-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Builds the cargo-fuzz targets in shakenfist-spice-protocol/fuzz and
  # smoke-runs each for a few seconds. This is a build-and-doesn't-panic
  # gate, not a real fuzz campaign -- long-running coverage-guided fuzzing
  # is tracked separately in shakenfist/ryll#135. The fuzz crate is its own
  # detached workspace (see fuzz/Cargo.toml's `[workspace]` table) so it
  # needs its own toolchain/cache/dependency install, independent of the
  # `lint` and `build` jobs above.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-fuzz-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_link_mess_parse, fuzz_link_reply_parse, fuzz_decrypt_password]
    steps:
      - uses: actions/checkout@v7

      # cargo-fuzz needs nightly for coverage-instrumented builds.
      # rustfmt is requested explicitly for the fuzz-crate format check
      # below (bare nightly does not include it).
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-${{ matrix.target }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config cmake libssl-dev

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The fuzz crate is a detached workspace, so the top-level lint job's
      # `cargo fmt --all --check` does not reach it. Format-check it here.
      - name: Check fuzz formatting
        working-directory: shakenfist-spice-protocol/fuzz
        run: cargo +nightly fmt --check

      - name: Build fuzz target
        working-directory: shakenfist-spice-protocol
        run: cargo +nightly fuzz build ${{ matrix.target }}

      - name: Smoke-run fuzz target
        working-directory: shakenfist-spice-protocol
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=30 -runs=100000

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: ""
          - name: Linux (aarch64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ""
          - name: macOS (aarch64)
            os: macos-latest
            target: aarch64-apple-darwin
            features: ""
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "--no-default-features"
          - name: Windows (aarch64)
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: "--no-default-features"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # audiopus_sys source-builds libopus on macOS and Windows when
      # pkg-config / vcpkg do not surface a system libopus. The bundled
      # libopus CMakeLists declares cmake_minimum_required(VERSION <3.5),
      # which CMake 4.x (now the default on macOS runners) refuses without
      # an explicit policy override. Setting CMAKE_POLICY_VERSION_MINIMUM
      # tells cmake to fall back to 3.5 policies for the libopus build —
      # the libopus source itself is unchanged. Linux installs libopus-dev
      # so audiopus_sys finds it via pkg-config and never invokes cmake.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # On Linux we install libopus-dev so audiopus_sys (the opus crate)
      # dynamic-links to libopus.so.0; cargo-deb's $auto then records
      # libopus0 as a runtime dep in the generated .deb. On macOS and
      # Windows we do not install opus via brew/vcpkg — audiopus_sys
      # falls back to building libopus from source (bundled vendor),
      # producing a self-contained binary with no runtime opus dep.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb1-dev \
            libx11-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libssl-dev \
            libasound2-dev \
            libopus-dev

      - name: Build
        run: cargo build --release -p ryll ${{ matrix.features }}

      - name: Run --web smoke test
        if: runner.os == 'Linux'
        run: tools/web-smoke.sh target/release/ryll

      - name: Run --web smoke test (TLS)
        if: runner.os == 'Linux'
        run: tools/web-smoke.sh --tls target/release/ryll

      - name: Run tests
        run: cargo test --workspace ${{ matrix.features }}

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: runner.os == 'Linux'
        run: cargo deb --no-build -p ryll

      - name: Upload .deb artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: deb-package-${{ matrix.target }}
          path: target/debian/*.deb
          retention-days: 30

      - name: Install cargo-generate-rpm
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm package
        if: runner.os == 'Linux'
        run: cargo generate-rpm -p ryll

      - name: Upload .rpm artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package-${{ matrix.target }}
          path: target/generate-rpm/*.rpm
          retention-days: 30

      - name: Create macOS tarball
        if: runner.os == 'macOS'
        run: |
          cd target/release
          tar czf ryll-${{ matrix.target }}.tar.gz ryll

      - name: Upload macOS tarball
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-tarball
          path: target/release/ryll-*.tar.gz
          retention-days: 30

      - name: Create Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target\release\ryll.exe `
            -DestinationPath target\release\ryll-${{ matrix.target }}.zip

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip-${{ matrix.target }}
          path: target/release/ryll-*.zip
          retention-days: 30

  # Check if the last commit was from the bot to prevent infinite loops in
  # automated fixer jobs. This runs early so other jobs can depend on it.
  check-bot-commit:
    name: "Check bot commit"
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, static]
    outputs:
      is_bot: ${{ steps.check.outputs.is_bot }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check if last commit was from bot
        id: check
        run: |
          LAST_AUTHOR_EMAIL=$(git log -1 --format='%ae')
          echo "Last commit author: $LAST_AUTHOR_EMAIL"
          if [ "$LAST_AUTHOR_EMAIL" = "bot@shakenfist.com" ]; then
            echo "is_bot=true" >> $GITHUB_OUTPUT
            echo "Last commit was from bot - automated fixers will be skipped"
          else
            echo "is_bot=false" >> $GITHUB_OUTPUT
          fi

  automated_reviewer:
    name: "Automated reviewer"
    runs-on: [self-hosted, claude-code]
    needs: [check-bot-commit, lint, build]
    if: >-
      ${{ github.event_name == 'pull_request' &&
          needs.check-bot-commit.outputs.is_bot != 'true' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-reviewer
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run automated reviewer
        uses: shakenfist/actions/review-pr-with-claude@main
        with:
          pr-number: ${{ github.event.pull_request.number }}
