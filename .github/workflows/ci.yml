name: CI

# CI runs in two tiers. The smoke tier (lint, build-linux, and the
# supply-chain scanners) runs on pull_request and gates the "Can
# enqueue" status check. The merge tier (fuzz and the GitHub-hosted
# build matrix) runs on merge_group and gates "Can merge", so the
# expensive cross-platform jobs only run against the exact commit that
# is about to land. workflow_dispatch deliberately runs both tiers, so
# pr-retest.yml's `gh workflow run ci.yml` stays a full retest and the
# merge tier can be exercised on a branch.
#
# Review-only changes (weaudit annotations and the rendered REVIEWS.md)
# cannot affect the build, so the check_paths job below skips every
# tier job for them. The gates still pass: their jq treats a skipped
# dependency as success. Keep check_paths' skip list in sync with the
# .vscode whitelist in .gitignore and with codeql-analysis.yml.
on:
  pull_request:
    branches: [develop]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # Detect review-only changes so the tier jobs can skip them. For
  # workflow_dispatch the filter step is skipped and the output defaults
  # to code_changed=true so everything runs.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # By default a file matches the filter if it matches ANY listed
          # pattern, which makes '**' match everything and silently
          # defeats the '!REVIEWS.md' style exclusions. 'every' requires a
          # file to match ALL patterns, which is the correct semantics for
          # an "everything except the review artefacts" filter.
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!REVIEWS.md'
              - '!.vscode/*.weaudit'
              - '!.vscode/*.weaudit-shas.json'
              - '!.vscode/review-scope.toml'

  # Smoke tier: everything below here runs on pull_request (and on
  # workflow_dispatch) and gates "Can enqueue".

  # Linux x86_64 jobs run on l-size self-hosted runners with the
  # build wrapped in the devcontainer (see Makefile), matching the
  # pattern instar uses. The debian-12-docker image ships with
  # docker.io preinstalled (see supply-chain.yml).
  #
  # The l pool is the scarcest resource on the fleet (MAX_WORKERS = 6
  # across every repo), so these three jobs carry the concurrency
  # block docs/ci.md requires of anything a pull request can trigger:
  # without it a superseded run holds an l slot for up to 45 minutes
  # while its replacement queues behind it.
  lint:
    name: Lint
    runs-on: [self-hosted, vm, debian-12-docker, l]
    timeout-minutes: 45
    needs: [check_paths]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting and run clippy
        run: make lint

  # A cheap proxy for the Windows builds in the merge tier: a cargo
  # check against the x86_64-pc-windows-gnu triple, cross-compiled from
  # the devcontainer (see
  # docs/plans/PLAN-two-stage-ci-phase-02-windows-check.md for why the
  # msvc triple CI actually builds cannot be checked this way).
  #
  # This is its own job rather than a step in build-linux. Measured on
  # PR #256, folding it into build-linux added about three minutes to
  # the longest smoke job — a cold registry compiles the whole graph
  # for the Windows target, and mingw-w64 adds to the image build — so
  # it sat directly on pull request feedback latency. As a separate job
  # it runs concurrently and costs a second devcontainer image build on
  # another runner instead.
  check-windows:
    name: Cross-check Windows
    runs-on: [self-hosted, vm, debian-12-docker, l]
    timeout-minutes: 45
    needs: [check_paths]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-check-windows
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Cross-check the Windows (gnu) target
        run: make check-windows

  # Linux x86_64 builds run on a self-hosted runner inside the
  # devcontainer via the Makefile, so this job's steps differ enough
  # from the GitHub-hosted matrix below to warrant a separate job.
  build-linux:
    name: Build (Linux x86_64)
    runs-on: [self-hosted, vm, debian-12-docker, l]
    timeout-minutes: 120
    needs: [check_paths]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build-linux
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: make release

      - name: Run --web smoke test
        run: make web-smoke

      - name: Run --web smoke test (TLS)
        run: make web-smoke-tls

      - name: Run tests
        run: make test

      - name: Build .deb package
        run: make deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-package-x86_64-unknown-linux-gnu
          path: target/debian/*.deb
          retention-days: 30

      - name: Build .rpm package
        run: make rpm

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package-x86_64-unknown-linux-gnu
          path: target/generate-rpm/*.rpm
          retention-days: 30

  # The five scanner jobs below are the PR-time half of the
  # supply-chain scanning design (docs/plans/PLAN-supply-chain-scanning.md,
  # and deny.toml for the cargo-deny policy). supply-chain.yml keeps
  # cargo-audit and cargo-deny on a weekly cron to catch advisory drift
  # against develop between PRs. All of them run on self-hosted VM
  # runners (the `vm` label excludes bare-metal runners which have
  # different OSes and no passwordless sudo) at size `s` (2 vCPU, 4 GB
  # RAM) — these scanners are I/O-bound and do not benefit from a
  # larger runner.

  # cargo-audit needs cargo on PATH. The static runner is minimal
  # (git only), so we run on debian-12 and install the stable rust
  # toolchain into $HOME via dtolnay/rust-toolchain (no sudo needed
  # for the toolchain itself).
  #
  # rustsec/audit-check reports its findings by creating a check run,
  # which needs `checks: write`. The workflow-level permissions above
  # do not grant it, and job-level permissions replace rather than
  # extend them, so this job restates the `contents: read` it needs
  # for the checkout. Without this the action fails with "Resource not
  # accessible by integration" — but only on runs where it actually
  # has something to report, so a clean audit hides the problem.
  cargo-audit:
    name: cargo audit
    runs-on: [self-hosted, vm, debian-12, s]
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    needs: [check_paths]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cargo-audit
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # cargo-deny-action runs cargo-deny inside a Docker
  # container, so this job needs the debian-12-docker image
  # which ships with docker.io preinstalled.
  cargo-deny:
    name: cargo deny
    runs-on: [self-hosted, vm, debian-12-docker, s]
    timeout-minutes: 15
    needs: [check_paths]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cargo-deny
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # gitleaks-action@v2 refuses to run on organization repos
  # without a paid licence. We invoke the upstream gitleaks
  # binary directly instead, which has no such restriction.
  # gitleaks is only packaged from Debian 13 (trixie) onward
  # — bookworm has no gitleaks package — so this job runs on
  # debian-13.
  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 15
    needs: [check_paths]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-gitleaks
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      # --log-opts="HEAD" scopes the scan to this branch and the
      # history behind it. Without it gitleaks scans every ref, which
      # is not what anyone means by "scan this project's history": it
      # pulls in every other branch, and on a project that publishes a
      # site from one it scans a built copy of its own documentation.
      # gitleaks 8.16 then attributes those findings to unrelated merge
      # commits, so they cannot be triaged either. HEAD still reaches
      # all of develop, so nothing is given up.
      - name: Run gitleaks
        run: >-
          gitleaks detect --source . --log-opts="HEAD" --redact
          --verbose --no-banner

  # shellcheck is packaged in Debian 12, so apt-install and run.
  shellcheck:
    name: shellcheck
    runs-on: [self-hosted, vm, debian-12, s]
    timeout-minutes: 15
    needs: [check_paths]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-shellcheck
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: ./tools/run-shellcheck.sh

  bidi-check:
    name: bidi and zero-width
    runs-on: [self-hosted, vm, debian-12, s]
    timeout-minutes: 15
    needs: [check_paths]
    if: >-
      github.event_name != 'merge_group'
      && needs.check_paths.outputs.code_changed != 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-bidi-check
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Scan tree for bidi and zero-width characters
        run: ./tools/check-bidi.sh

  # Merge tier: the two jobs below run on merge_group (and on
  # workflow_dispatch) and gate "Can merge". They are the expensive
  # ones, so they run against the commit that is actually landing
  # rather than on every push to a PR.

  # Builds the cargo-fuzz targets in shakenfist-spice-protocol/fuzz and
  # smoke-runs each for a few seconds. This is a build-and-doesn't-panic
  # gate, not a real fuzz campaign -- long-running coverage-guided fuzzing
  # is tracked separately in shakenfist/ryll#135. The fuzz crate is its own
  # detached workspace (see fuzz/Cargo.toml's `[workspace]` table) so it
  # needs its own toolchain/cache/dependency install, independent of the
  # `lint` and `build` jobs above.
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: [self-hosted, vm, debian-12-docker, l]
    timeout-minutes: 90
    needs: [check_paths]
    if: >-
      (github.event_name == 'merge_group'
       || github.event_name == 'workflow_dispatch')
      && needs.check_paths.outputs.code_changed != 'false'
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-fuzz-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_link_mess_parse, fuzz_link_reply_parse, fuzz_decrypt_password, fuzz_parse_host_subject]
    steps:
      - uses: actions/checkout@v7

      # The fuzz crate is a detached workspace, so the lint job's
      # `cargo fmt --all --check` does not reach it. Format-check it here.
      - name: Check fuzz formatting
        run: make fuzz-fmt-check

      - name: Build fuzz target
        run: make fuzz-build-${{ matrix.target }}

      - name: Smoke-run fuzz target
        run: make fuzz-smoke-${{ matrix.target }}

  # These platforms stay on GitHub-hosted runners: we own no macOS,
  # Windows, or aarch64 Linux hardware, and this is a public
  # repository so GitHub-hosted runner minutes are free.
  build:
    name: Build (${{ matrix.name }})
    needs: [check_paths]
    if: >-
      (github.event_name == 'merge_group'
       || github.event_name == 'workflow_dispatch')
      && needs.check_paths.outputs.code_changed != 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (aarch64)
            # audit-ok: github-hosted-runner -- no self-hosted aarch64 Linux hardware
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: ""
          - name: macOS (aarch64)
            # audit-ok: github-hosted-runner -- no self-hosted macOS hardware
            os: macos-latest
            target: aarch64-apple-darwin
            features: ""
          - name: Windows (x86_64)
            # audit-ok: github-hosted-runner -- no self-hosted Windows hardware
            os: windows-latest
            target: x86_64-pc-windows-msvc
            features: "--no-default-features"
          - name: Windows (aarch64)
            # audit-ok: github-hosted-runner -- no self-hosted Windows hardware
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            features: "--no-default-features"
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      # audiopus_sys source-builds libopus on macOS and Windows when
      # pkg-config / vcpkg do not surface a system libopus. The bundled
      # libopus CMakeLists declares cmake_minimum_required(VERSION <3.5),
      # which CMake 4.x (now the default on macOS runners) refuses without
      # an explicit policy override. Setting CMAKE_POLICY_VERSION_MINIMUM
      # tells cmake to fall back to 3.5 policies for the libopus build —
      # the libopus source itself is unchanged. Linux installs libopus-dev
      # so audiopus_sys finds it via pkg-config and never invokes cmake.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # On Linux we install libopus-dev so audiopus_sys (the opus crate)
      # dynamic-links to libopus.so.0; cargo-deb's $auto then records
      # libopus0 as a runtime dep in the generated .deb. On macOS and
      # Windows we do not install opus via brew/vcpkg — audiopus_sys
      # falls back to building libopus from source (bundled vendor),
      # producing a self-contained binary with no runtime opus dep.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config cmake \
            libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxcb1-dev \
            libx11-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libwayland-dev libssl-dev \
            libasound2-dev \
            libopus-dev

      - name: Build
        run: cargo build --release -p ryll ${{ matrix.features }}

      - name: Run --web smoke test
        if: runner.os == 'Linux'
        run: tools/web-smoke.sh target/release/ryll

      - name: Run --web smoke test (TLS)
        if: runner.os == 'Linux'
        run: tools/web-smoke.sh --tls target/release/ryll

      - name: Run tests
        run: cargo test --workspace ${{ matrix.features }}

      - name: Install cargo-deb
        if: runner.os == 'Linux'
        run: cargo install cargo-deb --locked

      - name: Build .deb package
        if: runner.os == 'Linux'
        run: cargo deb --no-build -p ryll

      - name: Upload .deb artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: deb-package-${{ matrix.target }}
          path: target/debian/*.deb
          retention-days: 30

      - name: Install cargo-generate-rpm
        if: runner.os == 'Linux'
        run: cargo install cargo-generate-rpm --locked

      - name: Build .rpm package
        if: runner.os == 'Linux'
        run: cargo generate-rpm -p ryll

      - name: Upload .rpm artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rpm-package-${{ matrix.target }}
          path: target/generate-rpm/*.rpm
          retention-days: 30

      - name: Create macOS tarball
        if: runner.os == 'macOS'
        run: |
          cd target/release
          tar czf ryll-${{ matrix.target }}.tar.gz ryll

      - name: Upload macOS tarball
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-tarball
          path: target/release/ryll-*.tar.gz
          retention-days: 30

      - name: Create Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target\release\ryll.exe `
            -DestinationPath target\release\ryll-${{ matrix.target }}.zip

      - name: Upload Windows zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip-${{ matrix.target }}
          path: target/release/ryll-*.zip
          retention-days: 30

  automated_reviewer:
    name: "Automated reviewer"
    # The needs: list is the "review only once CI has passed" gate:
    # a job skipped because a dependency failed never starts the
    # reusable workflow. It lists the smoke tier only -- the merge
    # tier never runs on a pull_request, so depending on it would
    # leave the reviewer permanently skipped. Everything else about
    # the reviewer -- runner, timeout, fork restriction, bot-commit
    # check -- lives in the shared workflow so it stays in step with
    # the rest of the fleet.
    needs:
      - lint
      - build-linux
      - check-windows
      - cargo-audit
      - cargo-deny
      - gitleaks
      - shellcheck
      - bidi-check
    # A cross-repository reusable workflow cannot grant itself more
    # token scope than its caller has, so the permissions go here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: shakenfist/actions/.github/workflows/pr-auto-review.yml@main
    secrets: inherit

  # The gates. "Can enqueue" and "Can merge" are the status checks the
  # branch ruleset requires; "Can see status" proves the ruleset can see
  # this workflow's checks at all. Each gate uses always() so it still
  # runs when a dependency failed or was skipped, and its jq maps every
  # dependency to "success or skipped" and requires all of them. That is
  # what lets a review-only change (where check_paths skips the whole
  # tier) pass; a cancelled or failed dependency fails the gate.

  can_see_status:
    name: "Can see status"
    runs-on: [self-hosted, static]
    # Runs "true", so five minutes is generous even on a busy runner.
    timeout-minutes: 5
    steps:
      - name: "Immediate success"
        run: true

  can_enqueue:
    name: "Can enqueue"
    needs:
      - check_paths
      - lint
      - build-linux
      - check-windows
      - cargo-audit
      - cargo-deny
      - gitleaks
      - shellcheck
      - bidi-check
    if: always() && github.event_name != 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"

  can_merge:
    name: "Can merge"
    needs:
      - check_paths
      - fuzz
      - build
    if: always() && github.event_name == 'merge_group'
    permissions:
      actions: read
    runs-on: [self-hosted, static]
    # A jq expression over the needs context.
    timeout-minutes: 5
    steps:
      - env:
          NEEDS_JSON: "${{toJSON(needs)}}"
        name: Transform outcomes
        run: |
          echo "ALL_SUCCESS=$(echo "$NEEDS_JSON" | jq '. | to_entries | map([.value.result == "success", .value.result == "skipped"] | any) | all')" >>$GITHUB_ENV
      - name: Check outcomes
        run: "[ $ALL_SUCCESS == true ]"
