# Supply-chain and prompt-injection scanners.
#
# Runs on every PR to develop and on pushes to develop, plus a weekly
# cron to catch advisory drift. Jobs prefer our self-hosted static
# runner and fall back to ubuntu-latest when they need tooling the
# static runner does not provide (cargo, gitleaks, shellcheck). See
# docs/plans/PLAN-supply-chain-scanning.md for the design rationale,
# and deny.toml for the policy enforced by cargo-deny.

name: Supply chain

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  schedule:
    # Weekly at 09:00 UTC on Monday. Catches advisory drift against
    # develop even when no PR has run recently.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # cargo-audit needs cargo on PATH. Our [self-hosted, static]
  # runner is minimal (git only), so this job runs on
  # GitHub-hosted ubuntu-latest where the rust toolchain is
  # installed explicitly by dtolnay/rust-toolchain.
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # cargo-deny-action downloads its own binary, so it works on
  # the bare self-hosted runner without a rust toolchain.
  cargo-deny:
    name: cargo deny
    runs-on: [self-hosted, static]
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  # gitleaks-action@v2 refuses to run on organization repos
  # without a paid licence. We invoke the upstream gitleaks
  # binary directly instead, which has no such restriction.
  # Runs on ubuntu-latest so apt provides the binary.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Run gitleaks
        run: gitleaks detect --source . --redact --verbose --no-banner

  # shellcheck is not installed on the self-hosted runner, so
  # this job runs on ubuntu-latest where apt has it.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: ./tools/run-shellcheck.sh

  bidi-check:
    name: bidi and zero-width
    runs-on: [self-hosted, static]
    steps:
      - uses: actions/checkout@v4

      - name: Scan tree for bidi and zero-width characters
        run: ./tools/check-bidi.sh
