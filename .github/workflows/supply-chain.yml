# Supply-chain and prompt-injection scanners.
#
# Runs on every PR to develop and on pushes to develop, plus a weekly
# cron to catch advisory drift. All jobs run on our self-hosted static
# runner. See docs/plans/PLAN-supply-chain-scanning.md for the design
# rationale, and deny.toml for the policy enforced by cargo-deny.

name: Supply chain

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  schedule:
    # Weekly at 09:00 UTC on Monday. Catches advisory drift against
    # develop even when no PR has run recently.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: [self-hosted, static]
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  cargo-deny:
    name: cargo deny
    runs-on: [self-hosted, static]
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  gitleaks:
    name: gitleaks
    runs-on: [self-hosted, static]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shellcheck:
    name: shellcheck
    runs-on: [self-hosted, static]
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          shellcheck -x scripts/*.sh tools/*.sh

  bidi-check:
    name: bidi and zero-width
    runs-on: [self-hosted, static]
    steps:
      - uses: actions/checkout@v4

      - name: Scan tree for bidi and zero-width characters
        run: ./tools/check-bidi.sh
