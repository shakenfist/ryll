# Supply-chain advisory drift scanner.
#
# This workflow's PR-time and push-time triggers were removed once
# ci.yml's smoke tier picked up all five scanners (cargo-audit,
# cargo-deny, gitleaks, shellcheck, bidi-check) on every pull
# request. What remains here is the weekly cron: it catches advisory
# drift (new RustSec advisories, cargo-deny policy violations)
# against develop in the gaps between PRs, when no smoke-tier run
# would otherwise notice. gitleaks, shellcheck, and the bidi/zero-width
# scan are dropped from this workflow entirely — their output only
# changes when the tree changes, and PR-time scanning for them now
# lives in ci.yml's smoke tier.
#
# The two remaining jobs run on self-hosted VM runners (the `vm`
# label excludes bare-metal runners which have different OSes and no
# passwordless sudo), targeting `debian-12` with size `s` (2 vCPU,
# 4 GB RAM) — these scanners are I/O-bound and do not benefit from a
# larger runner. cargo-deny instead targets `debian-12-docker`
# because cargo-deny-action runs its check inside a Docker container.
# See docs/plans/PLAN-supply-chain-scanning.md for the design
# rationale, and deny.toml for the policy enforced by cargo-deny.

name: Supply chain

on:
  schedule:
    # Weekly at 09:00 UTC on Monday. Catches advisory drift against
    # develop even when no PR has run recently.
    - cron: '0 9 * * 1'
  workflow_dispatch:

# rustsec/audit-check creates a check run to report findings, which
# needs `checks: write`; on scheduled runs it files issues instead,
# hence `issues: write`.
permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  # cargo-audit needs cargo on PATH. The static runner is minimal
  # (git only), so we run on debian-12 and install the stable rust
  # toolchain into $HOME via dtolnay/rust-toolchain (no sudo needed
  # for the toolchain itself).
  cargo-audit:
    name: cargo audit
    runs-on: [self-hosted, vm, debian-12, s]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cargo-audit
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # cargo-deny-action runs cargo-deny inside a Docker
  # container, so this job needs the debian-12-docker image
  # which ships with docker.io preinstalled.
  cargo-deny:
    name: cargo deny
    runs-on: [self-hosted, vm, debian-12-docker, s]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-cargo-deny
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
