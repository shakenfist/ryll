repos:
  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        entry: ./scripts/check-rust.sh check
        language: script
        pass_filenames: false
        files: \.rs$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lints the agent context (AGENTS.md and anything else an agent is
  # given) for malformed structure, smuggled instructions and the like.
  # Renovate's pre-commit manager keeps the rev current.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.19.0
    hooks:
      - id: skillsaw

  - repo: local
    hooks:
      - id: audit-range-test
        name: audit range smoke test
        entry: ./tools/audit/test-audit-range.sh
        language: script
        pass_filenames: false
        files: ^tools/audit/

      - id: wave1-style-test
        name: wave 1b style check smoke test
        entry: ./tools/audit/test-wave1-style.sh
        language: script
        pass_filenames: false
        files: ^tools/audit/

      # Same argument as the audit range above: the nightly fuzz
      # reporter is the only notification that lane has, so if it
      # breaks the breakage is silent until a fuzz target happens to
      # fail. --dry-run only; no network, no gh, no GH_TOKEN.
      - id: fuzz-reporter-test
        name: nightly fuzz reporter smoke test
        entry: ./tools/test-report-fuzz-failure.sh
        language: script
        pass_filenames: false
        files: ^tools/(test-)?report-fuzz-failure

      # And the marker walk that drives it. It decides what gets
      # reported at all, so a walk that reports nothing looks exactly
      # like a nightly with nothing to report -- the same silence, one
      # step further out. It stubs the reporter, so no gh either.
      #
      # fuzz.yml is in the file set because the test also pins the
      # marker names the workflow writes and the walk reads. Those are
      # independent literals on either side of an unlinted `run:`
      # block, so the drift this catches is a workflow-only edit.
      - id: fuzz-run-report-test
        name: nightly fuzz marker walk smoke test
        entry: ./tools/test-report-fuzz-run.sh
        language: script
        pass_filenames: false
        files: ^(tools/(test-)?report-fuzz-run|\.github/workflows/fuzz\.yml$)

      # And the target list the same lane fuzzes. A target this drops
      # is never built, never fails and so is never reported -- the
      # same silence, one step earlier in the pipeline. No Docker and
      # no cargo; it reads manifest fixtures.
      - id: fuzz-targets-test
        name: nightly fuzz target list smoke test
        entry: ./tools/test-fuzz-targets.sh
        language: script
        pass_filenames: false
        files: ^(tools/(test-)?fuzz-targets|shakenfist-spice-protocol/fuzz/Cargo\.toml)

  - repo: local
    hooks:
      - id: bidi-check
        name: bidi and zero-width unicode scan
        entry: ./tools/check-bidi.sh
        language: script
        pass_filenames: true

# The review tracking helpers (stamp, prune, regen, next) are run by
# hand via tools/review-tracking.sh, not from git hooks.
