repos:
  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        entry: ./scripts/check-rust.sh check
        language: script
        pass_filenames: false
        files: \.rs$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lints the agent context (AGENTS.md and anything else an agent is
  # given) for malformed structure, smuggled instructions and the like.
  # Renovate's pre-commit manager keeps the rev current.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.23.0
    hooks:
      - id: skillsaw

  - repo: local
    hooks:
      - id: audit-range-test
        name: audit range smoke test
        entry: ./tools/audit/test-audit-range.sh
        language: script
        pass_filenames: false
        files: ^tools/audit/

      - id: wave1-style-test
        name: wave 1b style check smoke test
        entry: ./tools/audit/test-wave1-style.sh
        language: script
        pass_filenames: false
        files: ^tools/audit/

      # Same argument as the audit range above: the nightly fuzz
      # reporter is the only notification that lane has, so if it
      # breaks the breakage is silent until a fuzz target happens to
      # fail. --dry-run only; no network, no gh, no GH_TOKEN.
      - id: fuzz-reporter-test
        name: nightly fuzz reporter smoke test
        entry: ./tools/test-report-fuzz-failure.sh
        language: script
        pass_filenames: false
        files: ^tools/(test-)?report-fuzz-failure

      # And the marker walk that drives it. It decides what gets
      # reported at all, so a walk that reports nothing looks exactly
      # like a nightly with nothing to report -- the same silence, one
      # step further out. It stubs the reporter, so no gh either.
      #
      # fuzz.yml is in the file set because the test also pins the
      # marker names the workflow writes and the walk reads. Those are
      # independent literals on either side of an unlinted `run:`
      # block, so the drift this catches is a workflow-only edit.
      - id: fuzz-run-report-test
        name: nightly fuzz marker walk smoke test
        entry: ./tools/test-report-fuzz-run.sh
        language: script
        pass_filenames: false
        files: ^(tools/(test-)?report-fuzz-run|\.github/workflows/fuzz\.yml$)

      # And the target list the same lane fuzzes. A target this drops
      # is never built, never fails and so is never reported -- the
      # same silence, one step earlier in the pipeline. No Docker and
      # no cargo; it reads manifest fixtures.
      - id: fuzz-targets-test
        name: nightly fuzz target list smoke test
        entry: ./tools/test-fuzz-targets.sh
        language: script
        pass_filenames: false
        files: ^(tools/(test-)?fuzz-targets|shakenfist-spice-protocol/fuzz/Cargo\.toml)

      # And the Proxmox lane's driver. Its negative checks pass when ryll
      # fails to connect, so a driver bug tends to read as a green lane,
      # and the lane itself books a nested Proxmox node to run. A fake
      # ryll and a fake mint script stand in; Python 3 only.
      - id: proxmox-smoke-test
        name: Proxmox lane driver smoke test
        entry: ./tools/test-proxmox-smoke.sh
        language: script
        pass_filenames: false
        files: ^tools/(test-)?proxmox-smoke

      # And the RDP smoke lane's driver: the pixel reads, colour
      # comparisons, ryll output lines and password scrub that decide its
      # pass and fail. The lane itself needs QEMU, Xvfb and FreeRDP, so
      # only these pure parts run here. Python 3 only.
      - id: rdp-smoke-test
        name: RDP smoke lane driver unit tests
        entry: ./tools/test-rdp-smoke.py
        language: script
        pass_filenames: false
        files: ^tools/(test-)?rdp-smoke

      # And MERGE-TEMPLATE.md's Wave 0 scanner, whose failure mode is a
      # scan that reads nothing, or reads the contributor's configuration,
      # and passes. It runs the real gitleaks and skillsaw through
      # pre-commit, so its first run needs network. CI's skillsaw job
      # runs it too.
      - id: wave0-scan-test
        name: Wave 0 scanner smoke test
        entry: ./tools/test-wave0-scan.sh
        language: script
        pass_filenames: false
        files: ^(tools/(test-)?wave0-scan\.sh|tools/check-bidi\.sh|\.pre-commit-config\.yaml)$

      # The feature parity matrix: one cell per mode in every row, and a
      # verdict the page defines at the start of every cell.
      - id: parity-matrix
        name: parity matrix shape and verdicts
        entry: ./tools/check-parity-matrix.py
        language: script
        pass_filenames: false
        files: ^(docs/multi-mode-parity\.md|tools/check-parity-matrix\.py)$

  - repo: local
    hooks:
      - id: bidi-check
        name: bidi and zero-width unicode scan
        entry: ./tools/check-bidi.sh
        language: script
        pass_filenames: true

  # Documentation names code by symbol, not line number: a line number
  # goes stale on the next edit to the code, in a change that never
  # touches the document. Plans are dated records and are exempt. This
  # is advisory -- it does not know about fenced blocks -- and the
  # docs-line-references consistency audit is the backstop.
  - repo: local
    hooks:
      - id: docs-line-references
        name: No source line-number references in documentation
        language: pygrep
        entry: >-
          \b[\w./-]+\.(py|pyi|rs|go|sh|proto|js|ts|c|h|cc|cpp|toml|ya?ml|j2|html):\d+(?:[-,]\d+)*(?![\d:])|/blob/(?![0-9a-f]{40}/)[^\s)#]+#L\d+
        types: [markdown]
        exclude: (^|/)plans/
      # The source size ratchet, from shakenfist/development's
      # templates/source-size-ratchet/. It has a CI job of its own as
      # well: CI here runs each hook as a separate job rather than
      # `pre-commit run --all-files`, so the hook on its own would gate
      # only commits made with hooks installed.
      - id: source-size-ratchet
        name: source size ratchet
        # python3 rather than relying on the copy's executable bit,
        # which a copy made by hand or through a web editor can lose.
        # -I (isolated mode) keeps tools/ off sys.path, so a module a
        # pull request plants there, such as tools/fnmatch.py, cannot
        # shadow the standard library and run inside the hook.
        entry: python3 -I tools/source-size-ratchet.py
        # The script is stdlib only, so it needs no managed environment.
        language: system
        # It measures the whole tree against the baseline, not the
        # files in the commit: a file's verdict depends on its entry in
        # tools/source-size-baseline, and that file is not source.
        pass_filenames: false
        # Any source file, the baseline or the exclude file can change
        # the verdict, including on a commit that touches only one of
        # the latter two, so there is no `files:` pattern that is not
        # narrower than what the check reads.
        always_run: true

# The review tracking helpers (stamp, prune, regen, next) are run by
# hand via tools/review-tracking.sh, not from git hooks.
