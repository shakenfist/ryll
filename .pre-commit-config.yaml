# The review tracking hooks need more than the default pre-commit
# stage; make a plain "pre-commit install" set them all up.
default_install_hook_types:
  - pre-commit
  - post-merge
  - post-checkout
  - post-rewrite

repos:
  - repo: local
    hooks:
      - id: rust-check
        name: rustfmt and clippy
        entry: ./scripts/check-rust.sh check
        language: script
        pass_filenames: false
        files: \.rs$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(scripts|tools)/
        types_or: [sh, bash, shell]
        args: ['-x']

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: bidi-check
        name: bidi and zero-width unicode scan
        entry: ./tools/check-bidi.sh
        language: script
        pass_filenames: true

  - repo: https://github.com/shakenfist/development
    rev: 0957d15d7e2b29088470a0535980545383be6687
    hooks:
      - id: review-stamp
      - id: review-prune
