[package]
name = "shakenfist-spice-compression"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure-Rust SPICE image decompression algorithms (QUIC, GLZ, LZ, LZ4), extracted from the ryll SPICE client."
readme = "README.md"

[features]
default = ["quic", "glz", "lz", "lz4", "jpeg", "mozjpeg"]
quic = []
glz = ["dep:tokio"]
lz = []
lz4 = ["dep:lz4_flex"]
jpeg = ["dep:jpeg-decoder"]
# Cross-platform SIMD-accelerated JPEG decode via the `mozjpeg`
# crate. The `with_simd` feature on `mozjpeg-sys` is enabled by
# default, which builds a vendored libjpeg-turbo with SIMD —
# no runtime system dependency on libjpeg. Implies `jpeg` so the
# `JpegDecoder` trait surface exists; the pure-Rust
# `jpeg-decoder` crate remains the universal fallback.
mozjpeg = ["dep:mozjpeg", "jpeg"]

[dependencies]
anyhow = "1"
byteorder = "1"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time"], optional = true }
lz4_flex = { version = "0.13", optional = true }
jpeg-decoder = { version = "0.3", optional = true }
# Pinned to 0.10.13 — the mozjpeg crate's surface has shifted
# across minor versions, so we lock to a specific release we have
# code paths for. Bump deliberately when the API is reverified.
# `with_simd` enables the SIMD-accelerated build of the vendored
# libjpeg-turbo via `mozjpeg-sys`, so the produced binary has no
# runtime libjpeg-turbo dependency.
mozjpeg = { version = "=0.10.13", optional = true, features = ["with_simd"] }

# macOS-only: ImageIO JPEG decoder backend. Pinned to the 0.3.x
# `objc2-*` family so the framework crates all agree on the
# underlying `objc2` major version. Feature sets are trimmed to
# only what `ImageIoDecoder` actually touches:
#   - objc2-image-io      : CGImageSource (CFData/CFDictionary)
#   - objc2-core-graphics : CGBitmapContext, CGColorSpace,
#                           CGContext, CGImage, CGGeometry
#   - objc2-core-foundation: CFData (for the input byte slice)
# `default-features = false` keeps the dep tree from pulling
# bitflags, block2, dispatch2, objc2, objc2-metal, etc., which
# we don't use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-image-io = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGImageSource",
    "objc2-core-graphics",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
    "CGGeometry",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CFData",
] }

# Windows-only: WIC JPEG decoder backend via the official `windows`
# crate. Feature set is trimmed to exactly what `WicDecoder` touches:
#   - Win32_Graphics_Imaging         : IWICImagingFactory,
#                                      IWICBitmapDecoder, IWICStream,
#                                      IWICFormatConverter, GUIDs
#                                      (CLSID_WICImagingFactory,
#                                      GUID_ContainerFormatJpeg,
#                                      GUID_WICPixelFormat32bppRGBA)
#   - Win32_System_Com               : CoInitializeEx,
#                                      CoCreateInstance, CLSCTX_*,
#                                      COINIT_MULTITHREADED
# `Win32_Foundation` (HRESULT etc.) is pulled in transitively via
# the imaging / com features. The `windows` crate's monolithic
# feature wall means adding more here would not bloat the build:
# only the listed feature modules' bindings are compiled.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }

# Linux-only: VA-API JPEG decoder backend probed via dlopen.
# `libloading` is the safe wrapper around dlopen/dlsym. We
# deliberately do NOT add libva as a link-time dependency — the
# entire point of `VaapiDecoder` is one Linux binary that adapts
# at runtime to whatever libva (if any) is installed. Picked up
# only on Linux; other Unix-like targets fall through to the
# mozjpeg / pure-Rust chain.
[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"
