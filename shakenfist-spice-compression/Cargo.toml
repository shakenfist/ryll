[package]
name = "shakenfist-spice-compression"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure-Rust SPICE image decompression algorithms (QUIC, GLZ, LZ, LZ4), extracted from the ryll SPICE client."
readme = "README.md"

[features]
default = ["quic", "glz", "lz", "lz4", "jpeg", "mozjpeg"]
quic = []
glz = ["dep:tokio"]
lz = []
lz4 = ["dep:lz4_flex"]
jpeg = ["dep:jpeg-decoder"]
# Cross-platform SIMD-accelerated JPEG decode via the `mozjpeg`
# crate. The `with_simd` feature on `mozjpeg-sys` is enabled by
# default, which builds a vendored libjpeg-turbo with SIMD —
# no runtime system dependency on libjpeg. Implies `jpeg` so the
# `JpegDecoder` trait surface exists; the pure-Rust
# `jpeg-decoder` crate remains the universal fallback.
mozjpeg = ["dep:mozjpeg", "jpeg"]

[dependencies]
anyhow = "1"
byteorder = "1"
tracing = "0.1"
tokio = { version = "1", features = ["sync", "time"], optional = true }
lz4_flex = { version = "0.13", optional = true }
jpeg-decoder = { version = "0.3", optional = true }
# Pinned to 0.10.13 — the mozjpeg crate's surface has shifted
# across minor versions, so we lock to a specific release we have
# code paths for. Bump deliberately when the API is reverified.
# `with_simd` enables the SIMD-accelerated build of the vendored
# libjpeg-turbo via `mozjpeg-sys`, so the produced binary has no
# runtime libjpeg-turbo dependency.
mozjpeg = { version = "=0.10.13", optional = true, features = ["with_simd"] }

# macOS-only: ImageIO JPEG decoder backend. Pinned to the 0.3.x
# `objc2-*` family so the framework crates all agree on the
# underlying `objc2` major version. Feature sets are trimmed to
# only what `ImageIoDecoder` actually touches:
#   - objc2-image-io      : CGImageSource (CFData/CFDictionary)
#   - objc2-core-graphics : CGBitmapContext, CGColorSpace,
#                           CGContext, CGImage, CGGeometry
#   - objc2-core-foundation: CFData (for the input byte slice)
# `default-features = false` keeps the dep tree from pulling
# bitflags, block2, dispatch2, objc2, objc2-metal, etc., which
# we don't use.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-image-io = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGImageSource",
    "objc2-core-graphics",
] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGImage",
    "CGGeometry",
] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = [
    "std",
    "CFData",
] }
