[package]
name = "shakenfist-spice-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure-Rust SPICE protocol primitives: constants, wire-format messages, link handshake, SpiceClient, and logging helpers. Extracted from the ryll SPICE client."
readme = "README.md"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
byteorder = "1"
rand = "0.8"
rsa = "0.9"
sha1 = "0.11"
tokio = { version = "1", features = ["io-util", "net"] }
tokio-rustls = "0.26"
tracing = "0.1"
rustls-pemfile = "2"
socket2 = { version = "0.6", features = ["all"] }
webpki-roots = "1.0"
