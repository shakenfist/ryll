[package]
name = "shakenfist-spice-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure-Rust SPICE protocol primitives: constants, wire-format messages, link handshake, SpiceClient, and logging helpers. Extracted from the ryll SPICE client."
readme = "README.md"

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
byteorder = "1"
rand = "0.8"
rsa = "0.10"
sha1 = "0.10"
tokio = { version = "1", features = ["io-util", "net", "time"] }
# `ring`, not the default `aws_lc_rs`. rustls's default provider
# decides which crypto library every consumer of this crate builds,
# and aws-lc-rs means aws-lc-sys: a C library built with cmake. This
# crate is the SPICE link handshake, so it is in the dependency tree
# of every consumer of the renderer -- including server-role ones that
# want display decode and nothing else -- and aws-lc-sys was the last
# C build any of them could not switch off (#593).
#
# Nothing here chooses a provider in code: `create_tls_connector` asks
# for the process-wide default (`CryptoProvider::get_default`) and
# fails with a message if the embedding process installed none. ryll
# and kerbside's proxy both install ring, so the feature now agrees
# with what they do rather than compiling a second library beside it.
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
thiserror = "2"
tracing = "0.1"
rustls-pemfile = "2"
socket2 = { version = "0.6", features = ["all"] }
webpki-roots = "1.0"
# Certificate subject DN parsing for host_subject pinning. Already in the
# workspace lockfile transitively (rcgen pulls it), so no new registry entry.
x509-parser = "0.18"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "macros", "rt"] }
# Mints certificates with controlled subject DNs for the host_subject
# matcher tests. Same version the ryll crate uses for its --web TLS tests.
rcgen = "0.14"
