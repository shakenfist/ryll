[package]
name = "shakenfist-spice-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# Only needed to name `RsaPrivateKey` in the `fuzz_decrypt_password` target's
# `OnceLock` static -- the key itself is generated via the parent crate's own
# `generate_ticket_keypair()`, never constructed directly here. Pinned to the
# same "0.9" the parent crate uses (see ../Cargo.toml).
rsa = "0.9"

[dependencies.shakenfist-spice-protocol]
path = ".."

# For the `fuzz_lz4_decode` target. Only the LZ4 decoder is needed, so the
# default decoder set (and mozjpeg's C build) is left out.
[dependencies.shakenfist-spice-compression]
path = "../../shakenfist-spice-compression"
default-features = false
features = ["lz4"]

# Detach this crate from the parent Cargo workspace. cargo-fuzz needs
# nightly and its own dependency resolution; without this empty
# `[workspace]` table, `cargo build --workspace` / `cargo test
# --workspace` on stable would try (and fail) to build this crate.
[workspace]

[[bin]]
name = "fuzz_link_mess_parse"
path = "fuzz_targets/fuzz_link_mess_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_link_reply_parse"
path = "fuzz_targets/fuzz_link_reply_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_decrypt_password"
path = "fuzz_targets/fuzz_decrypt_password.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_host_subject"
path = "fuzz_targets/fuzz_parse_host_subject.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_proxy_uri"
path = "fuzz_targets/fuzz_parse_proxy_uri.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_parse_connect_response"
path = "fuzz_targets/fuzz_parse_connect_response.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_server_bound"
path = "fuzz_targets/fuzz_server_bound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_client_bound"
path = "fuzz_targets/fuzz_client_bound.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_lz4_decode"
path = "fuzz_targets/fuzz_lz4_decode.rs"
test = false
doc = false
bench = false
