[package]
name = "shakenfist-spice-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebRTC bridge for the ryll SPICE client: SPICE-encoded video and audio over RTCPeerConnection, with a control datachannel for inputs and cursor overlay."
readme = "README.md"

[dependencies]
# WebRTC stack (umbrella crate; pinned to 0.17.1 which re-exports
# rtp = "^0.17.1", matching the rtp = "0.17.1" used in Phase 2
# step 2e's H264Payloader pre-flight).
webrtc = "0.17.1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"

# Byte utilities (shared with webrtc-rs's RTP packet type)
bytes = "1"

# Random values (SSRC, initial sequence numbers)
rand = "0.8"

# Opus encoder for the Phase 3 step 3d synthetic-audio pump. The
# `opus` crate wraps libopus through `audiopus_sys`, which probes
# for libopus via pkg-config and otherwise builds it from source
# with cmake — both work in the devcontainer. Phase 5 may reuse
# this same crate to encode raw PCM if SPICE negotiates an
# uncompressed playback format (master plan Resolution §5).
opus = "0.3"

# Renderer crate: provides EncodedFrame, EncoderControl, EncoderTask,
# H264Encoder, and SyntheticFrameSource used for the Phase 3 pumps
# and integration test.
shakenfist-spice-renderer = { path = "../shakenfist-spice-renderer", version = "0.1.4" }

# rustls 0.23 dropped the implicit default CryptoProvider; the
# DTLS handshake inside webrtc-rs needs one installed before the
# first PeerConnection is created. Pin to the version webrtc
# 0.17.1 pulls in transitively; "ring" feature ensures the ring
# backend is compiled in so install_default() succeeds.
rustls = { version = "0.23", features = ["ring"] }
