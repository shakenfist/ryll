[package]
name = "shakenfist-spice-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebRTC bridge for the ryll SPICE client: SPICE-encoded video and audio over RTCPeerConnection, with a control datachannel for inputs and cursor overlay."
readme = "README.md"

[lints]
workspace = true

[features]
# Exposes `test_client::TestPeer`, the client-side peer connection
# used to drive the browser half of a bridge exchange in tests. Off
# by default so it stays out of the production surface; enabled by
# this crate's own integration tests (via the self dev-dependency
# below) and by ryll's dev-dependency for the /offer signalling test.
test-support = []

[dependencies]
# WebRTC stack (umbrella crate). Held below 0.18 by a Renovate
# rule; 0.20 re-homes the crate on a sans-io core and needs a
# port of src/bridge.rs rather than a version bump. Tracked in
# docs/plans/PLAN-webrtc-0.20-upgrade.md.
webrtc = "0.17.1"

# RTP packet types and payloaders (H264Payloader, OpusPayloader,
# Header, Packet). `webrtc` re-exports this crate as
# `webrtc::rtp`, but that re-export is gone in 0.20, and
# shakenfist-spice-renderer already depends on it directly for
# tests/webrtc_h264_smoke.rs. Depending on it by name here keeps
# both crates on one declaration and takes the re-export off the
# 0.20 port's critical path (phase 01 step 1b).
rtp = "0.17"

# Host interface enumeration, so the WebRTC UDP sockets can be bound
# to real addresses instead of the placeholder 0.0.0.0, which binds
# fine and then produces host candidates every browser discards (see
# src/bind_addrs.rs and Decision 4 of
# docs/plans/PLAN-webrtc-0.20-upgrade-phase-02-bump.md). MIT OR
# BSD-3-Clause, both already on deny.toml's allowlist; pulls in libc
# on unix and windows-sys 0.61 on Windows, and 0.61.2 is already in
# Cargo.lock, so it adds no duplicate dependency version.
if-addrs = "0.15"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"

# Byte utilities (shared with webrtc-rs's RTP packet type)
bytes = "1"

# Random values (SSRC, initial sequence numbers)
rand = "0.8"

# Opus encoder for the Phase 3 step 3d synthetic-audio pump. The
# `opus` crate wraps libopus through `audiopus_sys`, which probes
# for libopus via pkg-config and otherwise builds it from source
# with cmake — both work in the devcontainer. Phase 5 may reuse
# this same crate to encode raw PCM if SPICE negotiates an
# uncompressed playback format (master plan Resolution §5).
opus = "0.3"

# Renderer crate: provides EncodedFrame, EncoderControl, EncoderTask,
# H264Encoder, and SyntheticFrameSource used for the Phase 3 pumps
# and integration test.
shakenfist-spice-renderer = { path = "../shakenfist-spice-renderer", version = "0.1.7", default-features = false }

# rustls 0.23 dropped the implicit default CryptoProvider; the
# DTLS handshake inside webrtc-rs needs one installed before the
# first PeerConnection is created. Pin to the version webrtc
# 0.17.1 pulls in transitively; "ring" feature ensures the ring
# backend is compiled in so install_default() succeeds.
rustls = { version = "0.23", features = ["ring"] }

[dev-dependencies]
# Self dev-dependency purely to turn on `test-support` for this
# crate's integration tests. Files in tests/ link the crate the way
# an external consumer does, so they cannot see a `#[cfg(test)]`
# module and cannot enable a feature on themselves any other way.
# Cargo supports this specifically for the case.
shakenfist-spice-webrtc = { path = ".", features = ["test-support"] }
