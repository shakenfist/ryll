[package]
name = "shakenfist-spice-webrtc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebRTC bridge for the ryll SPICE client: SPICE-encoded video and audio over RTCPeerConnection, with a control datachannel for inputs and cursor overlay."
readme = "README.md"

[lints]
workspace = true

[features]
# Exposes `test_client::TestPeer`, the client-side peer connection
# used to drive the browser half of a bridge exchange in tests. Off
# by default so it stays out of the production surface; enabled by
# this crate's own integration tests (via the self dev-dependency
# below) and by ryll's dev-dependency for the /offer signalling test.
test-support = []

[dependencies]
# WebRTC stack (umbrella crate). 0.20 is a ~9k-line async shim over
# the sans-io `rtc` core below: a peer connection is built through
# `PeerConnectionBuilder`, events arrive through one
# `PeerConnectionEventHandler`, and datachannels and remote tracks are
# polled rather than given callbacks. 0.20.2 specifically, not "0.20":
# 0.20.0 has a driver hot-loop on a non-advancing timeout and 0.20.1
# still schedules ICE checks in terminal states, both of which this
# crate's tests and the server-side reaper walk straight into. Declared
# as a floor rather than `=0.20.2` so patch updates still flow. See
# docs/plans/PLAN-webrtc-0.20-upgrade.md.
#
# Still 0.20.2 even though docs/web-mode-internals.md describes
# pre-0.20.4 stream-id assignment as broken: what 0.20.4 fixed is the
# id picked for an *in-band* channel created before the DTLS role is
# known, and the control channel no longer takes that path. Checked
# rather than assumed — 0.20.2 and 0.20.3 both overwrite the
# generated id with an explicit `negotiated` one
# (`rtc-0.20.2/src/peer_connection/mod.rs:1888`) and pass the flag to
# `DataChannel::dial`, which suppresses the DCEP open
# (`rtc-0.20.2/src/data_channel/internal.rs:83`). Pinning the stream
# id is what makes the floor a non-issue here, so there is nothing to
# raise it for.
webrtc = "0.20.2"

# The sans-io core `webrtc` is built on. A direct dependency because
# `webrtc` deliberately does not re-export it, yet its types appear in
# `webrtc`'s public API: `TrackLocal::write_rtp` takes an
# `rtc::rtp::Packet`, `add_transceiver_from_kind` takes an
# `rtc::…::RtpCodecKind`, and the codec constants and payloaders live
# there too. `webrtc` pins `rtc` to an exact patch, so naming the same
# version here guarantees by construction that the `Packet` we build is
# the type `write_rtp` expects — the alignment-by-hand that issue #215
# was about. Replaces the standalone `rtp` crate, an abandoned line
# ending at 0.17.2 (Decision 2).
rtc = "0.20.2"

# `webrtc::peer_connection::PeerConnectionEventHandler` is declared with
# `#[async_trait::async_trait]`, and `webrtc` does not re-export the
# macro, so every implementor has to annotate its own impl with it —
# which is what all 35 shipped examples do. Already in Cargo.lock at
# 0.1.92 as a transitive dependency, so this adds an edge, not a crate.
async-trait = "0.1"

# Host interface enumeration, so the WebRTC UDP sockets can be bound
# to real addresses instead of the placeholder 0.0.0.0, which binds
# fine and then produces host candidates every browser discards (see
# src/bind_addrs.rs and
# docs/plans/PLAN-webrtc-0.20-upgrade.md). MIT OR
# BSD-3-Clause, both already on deny.toml's allowlist; pulls in libc
# on unix and windows-sys 0.61 on Windows, and 0.61.2 is already in
# Cargo.lock, so it adds no duplicate dependency version.
if-addrs = "0.15"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"

# Byte utilities (shared with webrtc-rs's RTP packet type)
bytes = "1"

# Random values (SSRC, initial sequence numbers)
rand = "0.8"

# Opus encoder for the synthetic-audio pump. The `opus` crate
# wraps libopus through `audiopus_sys`, which probes for libopus
# via pkg-config and otherwise builds it from source with cmake —
# both work in the devcontainer. The same crate could encode raw
# PCM if SPICE ever negotiates an uncompressed playback format.
opus = "0.4"

# Renderer crate: provides EncodedFrame, EncoderControl, EncoderTask,
# H264Encoder, and SyntheticFrameSource used for the media pumps
# and the integration test.
shakenfist-spice-renderer = { path = "../shakenfist-spice-renderer", version = "0.1.7", default-features = false }

[dev-dependencies]
# Self dev-dependency purely to turn on `test-support` for this
# crate's integration tests. Files in tests/ link the crate the way
# an external consumer does, so they cannot see a `#[cfg(test)]`
# module and cannot enable a feature on themselves any other way.
# Cargo supports this specifically for the case.
shakenfist-spice-webrtc = { path = ".", features = ["test-support"] }
