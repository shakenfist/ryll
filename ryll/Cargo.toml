[package]
name = "ryll"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A Rust SPICE VDI test client"

# Explicit bin target so maturin's bindings = "bin" (see pyproject.toml)
# packages a binary named exactly `ryll`. Cargo would auto-discover
# src/main.rs as a bin of the package name anyway; this pins it.
[[bin]]
name = "ryll"
path = "src/main.rs"

[lints]
workspace = true

[features]
# `gui`, `audio`, and `capture` are all default-on so production
# builds (debian package, GUI install) keep their behaviour.
# `cargo build --no-default-features -p ryll` is the slim
# headless build used by the kerbside loadtest and direct-qemu
# CI lane: no eframe, no arboard, no rfd, no cpal, no opus-
# decoder.  See docs/control-socket-protocol.md and PLAN-test-
# harness-phase-06-digest-decoding.md for the rationale.
default = ["capture", "gui", "audio"]

# `gui` carries the egui/eframe display, the arboard host-side
# clipboard, and the rfd native file picker.  Disabled at compile
# time produces a ryll binary that requires `--headless` (or
# `--web`) and exits with a clear error if invoked without one.
gui = ["dep:eframe", "dep:arboard", "dep:rfd"]

# `audio` enables the cpal/opus playback pipeline both here and
# in shakenfist-spice-renderer.  Disabling it leaves the SPICE
# main channel running normally but skips the playback channel
# (logs "Skipping playback channel: audio feature disabled").
audio = ["shakenfist-spice-renderer/audio"]

# `digest-decode` plumbs through to
# shakenfist-spice-renderer/digest-decode, which adds the
# shakenfist-visual-digest dependency, a 100 ms QR-decode
# polling task in the headless session, and the
# `digest_updated` control-socket event.  Test-harness only;
# production builds (debian, GUI) leave it off.
digest-decode = ["shakenfist-spice-renderer/digest-decode"]

capture = ["dep:pcap-file", "dep:etherparse", "dep:mp4"]
# Diagnostic-only feature for the K1 hang investigation. Adds
# `console-subscriber` and a startup hook that exposes ryll's
# tokio runtime to a `tokio-console` TUI viewer over a unix
# socket. Build with `make build-tokio-console`, then run ryll
# with `RYLL_TOKIO_CONSOLE=1` set. Connect from another terminal
# with `tokio-console`. Will be removed when K1 is closed.
tokio-console = ["dep:console-subscriber"]

[dependencies]
# GUI framework.  Gated behind the `gui` feature so the slim
# headless build does not link eframe / egui / egui-winit / the
# winit/wayland/xkb runtime libraries those pull in.
eframe = { version = "0.35", features = ["persistence"], optional = true }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "1.0"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Binary protocol handling
bytes = "1"
byteorder = "1"

# Cryptography for SPICE auth
rsa = "0.9"
sha1 = "0.10"
rand = "0.8"

# Audio playback lives in shakenfist-spice-renderer's
# `channels::playback` module and is gated by the `audio`
# feature on that crate.  ryll's own `audio` feature
# (above) toggles the dependency through to the renderer.

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Optional tokio-console diagnostic subscriber. Pulled in only by
# the `tokio-console` feature. Requires the rest of the build to
# be compiled with `RUSTFLAGS=--cfg tokio_unstable` so that
# tokio's instrumentation hooks are enabled.
console-subscriber = { version = "0.5", optional = true }

# Config file parsing
configparser = "3"

# HTTP for URL config fetching
reqwest = { version = "0.13", features = ["blocking"] }

# LZ4 compression/decompression for general data (webdav, usbredir).
# SPICE image LZ4 lives in shakenfist-spice-compression below.
lz4_flex = "0.14"

# Extracted SPICE codecs. Path+version dual-spec: cargo uses the
# path when building locally and the published crate when resolving
# from crates.io. Versions are kept in lockstep with ryll via
# cargo-release; see tools/cut-release.sh.
shakenfist-spice-compression = { path = "../shakenfist-spice-compression", version = "0.1.6" }
shakenfist-spice-protocol = { path = "../shakenfist-spice-protocol", version = "0.1.6" }
shakenfist-spice-renderer = { path = "../shakenfist-spice-renderer", version = "0.1.6", default-features = false }
shakenfist-spice-usbredir = { path = "../shakenfist-spice-usbredir", version = "0.1.6" }
shakenfist-spice-webrtc = { path = "../shakenfist-spice-webrtc", version = "0.1.6" }

# Zlib decompression for SPICE ZLIB_GLZ_RGB (type 107)
flate2 = "1"

# JPEG decoding for SPICE JPEG image type
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jpeg-decoder = "0.3"

# Capture mode (--capture) — optional, disabled on Windows
pcap-file = { version = "2", optional = true }
etherparse = { version = "0.20", optional = true }
mp4 = { version = "0.14", optional = true }

# Clipboard access (host <-> guest copy/paste).  Gated behind
# the `gui` feature because the only consumer is the eframe
# UI; the headless control socket has its own `paste` verb that
# does not touch the host clipboard.
arboard = { version = "3", optional = true }

# Signal handling (Ctrl+C graceful shutdown, cross-platform)
ctrlc = "3"

# Serialisation (for bug report snapshots)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bug report zip output and PNG screenshots
zip = "8"
png = "0.18"

# Per-thread CPU metrics via sysconf(_SC_CLK_TCK) (Linux only)
libc = "0.2"

# Error handling
thiserror = "2"
anyhow = "1"

# Async channels
async-channel = "2"

# TCP keepalive configuration (matches spice-gtk behaviour)
socket2 = { version = "0.6", features = ["all"] }

# USB device access (pure Rust, no libusb)
nusb = "0.2"

# Native file dialog for USB disk image selection.  GUI-only.
rfd = { version = "0.17", optional = true }

# WebDAV server (RFC 4918 handler with LocalFs backend)
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }

# HTTP framing for WebDAV byte-stream transport
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"

# HTTP server and routing for --web mode
axum = "0.8"

# TLS-capable axum bind path. `tls-rustls-no-provider` keeps the
# rustls 0.23 + ring provider pinning the workspace already chose
# (main.rs installs `rustls::crypto::ring::default_provider()`)
# rather than forcing the aws-lc-rs surface that the plain
# `tls-rustls` feature would activate. `RustlsConfig::from_pem_file`
# picks up the process-wide default provider at runtime.
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }

# TLS crypto provider — needed by --web mode to install the
# rustls ring provider at startup before any WebRTC offers
# arrive. webrtc-rs pulls it in transitively but an explicit
# dep here makes `install_default()` resolvable from main.rs
# without reaching into a transitive crate's re-exports.
rustls = { version = "0.23", features = ["ring"] }

# Constant-time comparison for token auth (timing-safe)
subtle = "2"

# Base64 for PNG-encoded cursor shapes shipped over the control
# DC in --web mode.
base64 = "0.22"

# Query-string parsing for token extraction
url = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Self-signed cert generation for the --web TLS integration tests.
rcgen = "0.14"
# Phase 4 step 4c uses a real webrtc-rs client PC to drive an
# SDP offer through the in-process axum router. rustls is
# pinned to ring because both aws-lc-rs and ring are pulled in
# transitively and rustls 0.23 requires an explicit choice.
webrtc = "0.17.1"
rustls = { version = "0.23", features = ["ring"] }

[package.metadata.deb]
maintainer = "Michael Still <mikal@stillhq.com>"
section = "utils"
priority = "optional"
# $auto scans the binary's NEEDED entries and picks up libopus0
# (introduced by --web mode via audiopus_sys dynamic-linking to
# libopus.so.0), libasound2, libxcb1, etc. automatically.
# Phase 7b installs libopus-dev on Linux CI runners so the binary
# dynamic-links libopus; $auto therefore captures the runtime dep.
depends = "$auto"
assets = [
    ["target/release/ryll", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
# auto-req = "auto" (the default) uses ldd-based detection to generate
# RPM Requires entries from the binary's NEEDED entries. This picks up
# opus (Fedora/RHEL package name) introduced by --web mode, plus any
# other shared-library deps, without requiring a manual requires list.
# Supported since cargo-generate-rpm 0.11; "auto" is the default so
# this line is explicit documentation of the chosen policy.
auto-req = "auto"
assets = [
    { source = "target/release/ryll", dest = "/usr/bin/ryll", mode = "0755" },
]
