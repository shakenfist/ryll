[package]
name = "ryll"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "A Rust SPICE VDI test client"

[features]
default = ["capture"]
capture = ["dep:pcap-file", "dep:etherparse", "dep:openh264", "dep:mp4"]

[dependencies]
# GUI framework
eframe = { version = "0.29", features = ["persistence"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "0.26"

# CLI parsing
clap = { version = "4", features = ["derive"] }

# Binary protocol handling
bytes = "1"
byteorder = "1"

# Cryptography for SPICE auth
rsa = "0.9"
sha1 = "0.10"
rand = "0.8"

# Audio playback. A dedicated audio thread owns the cpal stream
# so it never needs to be Send. The rtrb ring buffer provides
# lock-free sample transfer from the tokio network task.
cpal = "0.15"
opus-decoder = "0.1"
rtrb = "0.3"

# Logging
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config file parsing
configparser = "3"

# HTTP for URL config fetching
reqwest = { version = "0.12", features = ["blocking"] }

# LZ4 compression/decompression for general data (webdav, usbredir).
# SPICE image LZ4 lives in shakenfist-spice-compression below.
lz4_flex = "0.13"

# Extracted SPICE codecs. Path+version dual-spec: cargo uses the
# path when building locally and the published crate when resolving
# from crates.io. Versions are kept in lockstep with ryll via
# cargo-release; see tools/cut-release.sh.
shakenfist-spice-compression = { path = "../shakenfist-spice-compression", version = "0.1.5" }
shakenfist-spice-protocol = { path = "../shakenfist-spice-protocol", version = "0.1.5" }
shakenfist-spice-usbredir = { path = "../shakenfist-spice-usbredir", version = "0.1.5" }

# Zlib decompression for SPICE ZLIB_GLZ_RGB (type 107)
flate2 = "1"

# JPEG decoding for SPICE JPEG image type
image = { version = "0.25", default-features = false, features = ["jpeg"] }
jpeg-decoder = "0.3"

# Capture mode (--capture) — optional, disabled on Windows
pcap-file = { version = "2", optional = true }
etherparse = { version = "0.16", optional = true }
openh264 = { version = "0.6", optional = true }
mp4 = { version = "0.14", optional = true }

# Clipboard access (host <-> guest copy/paste)
arboard = "3"

# Signal handling (Ctrl+C graceful shutdown, cross-platform)
ctrlc = "3"

# Serialisation (for bug report snapshots)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bug report zip output and PNG screenshots
zip = "2"
png = "0.18"

# Per-thread CPU metrics via sysconf(_SC_CLK_TCK) (Linux only)
libc = "0.2"

# Error handling
thiserror = "1"
anyhow = "1"

# Async channels
async-channel = "2"

# TCP keepalive configuration (matches spice-gtk behaviour)
socket2 = { version = "0.6", features = ["all"] }

# USB device access (pure Rust, no libusb)
nusb = "0.2"

# Native file dialog for USB disk image selection
rfd = "0.15"

# WebDAV server (RFC 4918 handler with LocalFs backend)
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }

# HTTP framing for WebDAV byte-stream transport
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "Michael Still <mikal@stillhq.com>"
section = "utils"
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/ryll", "usr/bin/", "755"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/ryll", dest = "/usr/bin/ryll", mode = "0755" },
]
