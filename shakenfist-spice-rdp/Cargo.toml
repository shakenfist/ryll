[package]
name = "shakenfist-spice-rdp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "RDP frontend for the ryll SPICE client: serves a SPICE session to stock RDP clients with IronRDP"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# The RDP server: connection acceptance, TLS and CredSSP security,
# capability negotiation, and the bitmap and RemoteFX encoders. This
# crate supplies the display and input handlers it is built with.
# Every IronRDP minor release so far has changed the server API, so
# the pin is to one minor and an upgrade is deliberate work. Default
# features are off because the defaults include `qoi` and `qoiz`,
# two IronRDP-private codecs that no stock RDP client negotiates and
# that would pull `qoicoubeh` and a second `zstd-safe` major beside
# the one ryll already carries through `zip`. `rayon` parallelises
# RemoteFX tile encoding; `helper` provides `TlsIdentityCtx`, which
# loads a PEM certificate and key and derives the public key CredSSP
# needs.
# Declares rust-version 1.89, which sets the workspace floor. Pulls in
# the rest of the IronRDP family (acceptor, connector, pdu, graphics
# and the static and dynamic channel crates), `sspi` and `picky` for
# CredSSP, and a `reqwest` 0.12 beside ryll's 0.13 through
# `ironrdp-tokio`. Through `sspi`'s smart-card support it also pulls
# `winscard`, which turns on `flate2`'s `zlib` backend and so
# `libz-sys`: that links the system zlib where pkg-config finds one
# and otherwise builds the bundled copy with the C compiler. The
# IronRDP crates are MIT OR Apache-2.0, and the rest of what they
# pull is within deny.toml's licence allowlist.
ironrdp-server = { version = "0.13", default-features = false, features = ["rayon", "helper"] }

# The display-control monitor layout a client sends when its window
# changes size, which `RdpServerDisplay::request_layout` takes and
# `ironrdp-server` does not re-export. The version `ironrdp-server`
# builds on, already in Cargo.lock through it, so this adds an edge,
# not a crate.
ironrdp-displaycontrol = "0.8"

# The clipboard channel's backend and backend factory traits, the
# messages a backend sends the server, and the clipboard PDU types,
# none of which `ironrdp-server` re-exports. The version
# `ironrdp-server` builds on, already in Cargo.lock through it, so
# this adds an edge, not a crate.
ironrdp-cliprdr = "0.7"

# The audio format and wave format types the sound handler offers its
# formats in, and the negotiated format and error types its trait
# methods take, none of which `ironrdp-server` re-exports. The version
# `ironrdp-server` builds on, already in Cargo.lock through it, so
# this adds an edge, not a crate.
ironrdp-rdpsnd = "0.9"

# `AsAny`, which the clipboard backend trait requires of every
# backend, and the `impl_as_any!` macro that implements it. The
# version the other IronRDP crates build on, already in Cargo.lock
# through them, so this adds an edge, not a crate.
ironrdp-core = "0.3"

# The IronRDP display and input handler traits are declared with
# `#[async_trait::async_trait]`, and `ironrdp-server` does not
# re-export the macro, so implementors annotate their own impls with
# it. Already in Cargo.lock, so this adds an edge, not a crate.
async-trait = "0.1"

# Renderer crate: provides the surface mirror the display handler
# reads damage from, and the input event and display size types the
# input handler sends. No renderer features: this crate reads
# decoded surfaces and sends input, so it needs neither the H.264
# encoder nor any optional decoder.
shakenfist-spice-renderer = { path = "../shakenfist-spice-renderer", version = "0.3.0", default-features = false }

# Protocol crate: the mouse-mode and keyboard-modifier constants the
# input handler maps RDP input onto.
shakenfist-spice-protocol = { path = "../shakenfist-spice-protocol", version = "0.3.0" }

# Async runtime. The server runs on a current-thread runtime on a
# thread of its own, so the multi-thread scheduler is not needed.
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }

# TLS for both RDP security modes. `TlsIdentity::acceptor` returns
# a `tokio_rustls::TlsAcceptor` and builds its rustls server config
# from the process-wide crypto provider. The same release
# `ironrdp-server` builds on and the other workspace crates use, so
# this adds an edge, not a crate.
tokio-rustls = "0.26"

# Error handling
anyhow = "1"

# Logging
tracing = "0.1"

# Byte buffers for bitmap updates (the type IronRDP's `BitmapUpdate`
# carries its pixel data in)
bytes = "1"

# The per-launch password. 0.9 rather than the 0.8 the other
# workspace crates use, because `ironrdp-connector` already pulls 0.9
# into Cargo.lock, so this adds an edge, not a crate.
rand = "0.9"

# Self-signed certificate generation when no certificate is supplied.
# The same version ryll/Cargo.toml uses for its --web TLS tests and
# shakenfist-spice-protocol for its matcher tests.
rcgen = "0.14"

# SHA-256 fingerprint of the server certificate, printed at launch so
# a user can match what the RDP client shows. 0.11 is the version
# already in Cargo.lock.
sha2 = "0.11"

[dev-dependencies]
# Paused time for the display handler's tests, which wait on its
# damage poll interval without sleeping in real time.
tokio = { version = "1", features = ["test-util"] }

# The input handler's tests build RDP synchronize events, whose lock
# flags type `ironrdp-server` uses but does not re-export, and the
# loopback test builds the client's key events and capability types
# from it. Already in Cargo.lock through `ironrdp-server`, so this
# adds an edge, not a crate.
ironrdp-pdu = "0.9"

# The static channel trait, through which the sound handler's tests
# drive IronRDP's own audio channel through its handshake. Already in
# Cargo.lock through `ironrdp-server`, so this adds an edge, not a
# crate.
ironrdp-svc = "0.8"

# IronRDP's own client, which the loopback test (tests/loopback.rs)
# drives against `serve` to prove the handshake without a desktop RDP
# client: the connector runs the connection sequence, the session
# decodes the display updates the server sends, `ironrdp-tokio` frames
# the PDUs over a tokio socket, and `ironrdp-tls` upgrades the socket
# to TLS without verifying the server's self-signed certificate. The
# versions are the ones `ironrdp-server` builds on. The connector and
# tokio crates are already in Cargo.lock through it; the session crate
# (with `ironrdp-bulk`, its bulk decompressor) and the TLS crate are
# new to the tree and reach only test builds. The `rustls` feature
# selects the TLS backend with the aws-lc-rs provider the workspace
# already carries.
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-tokio = "0.10"
ironrdp-tls = { version = "0.2", features = ["rustls"] }
