[package]
name = "shakenfist-spice-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared SPICE rendering substrate for ryll: software framebuffer, channel handlers, session orchestration."
readme = "README.md"

[lints]
workspace = true

[features]
# Everything except `digest-decode` is default-on, so a plain
# dependency on this crate builds the full client. A consumer that
# wants display decode alone (for example a frontend that relays the
# guest's screen and never touches USB, shared folders or H.264) uses
# `default-features = false` and names what it needs; that build
# compiles none of the C codecs or device stacks the features below
# gate. (The protocol crate's TLS stack is not among them.)
default = ["audio", "usbredir", "webdav", "encoder", "h264-decode", "mozjpeg"]

# `audio` pulls in the cpal/opus/rtrb playback stack and the
# `channels::playback` module that depends on them.
audio = ["dep:cpal", "dep:opus-decoder", "dep:rtrb"]

# `usbredir` is the usbredir channel (`channels::usbredir`) and the
# USB device backends in `usb` (physical passthrough via nusb on
# Linux, and virtual mass storage). Without it the channel is not
# linked.
usbredir = ["dep:nusb", "dep:shakenfist-spice-usbredir"]

# `webdav` is the WebDAV folder-sharing channel (`channels::webdav`)
# and the RFC 4918 server in `webdav`. Without it the channel is not
# linked.
webdav = ["dep:dav-server", "dep:hyper", "dep:hyper-util"]

# `encoder` is the live H.264 encoder (`H264Encoder`, `EncoderTask`)
# used by ryll's web frontend and capture. It builds openh264 from
# vendored C++ source. The frame-source traits, `EncodedFrame` and
# `EncoderControl` stay available without it.
encoder = ["shakenfist-spice-compression/encode"]

# `h264-decode` decodes H.264 video streams (openh264). Without it
# the display channel neither advertises H.264 nor asks for it, so
# the server sends MJPEG or plain draw commands instead.
h264-decode = ["shakenfist-spice-compression/h264-decode"]

# `mozjpeg` is the SIMD JPEG decoder (vendored libjpeg-turbo, a C
# build). Without it JPEG and MJPEG decode through the platform
# decoder where there is one, else the pure-Rust `jpeg-decoder`.
mozjpeg = ["shakenfist-spice-compression/mozjpeg"]

# `digest-decode` enables QR-encoded visual-digest detection on
# the primary surface and emission of `digest_updated` events on
# the control socket.  Off by default: production ryll binaries
# do not carry the QR decoder.  Test-harness builds opt in via
# `cargo build --features digest-decode`.
digest-decode = ["dep:shakenfist-visual-digest"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Audio playback. A dedicated audio thread owns the cpal stream
# so it never needs to be Send. The rtrb ring buffer provides
# lock-free sample transfer from the tokio network task. All
# three live behind the default-on `audio` feature so a slim
# build (`--no-default-features`) does not link them.
cpal = { version = "0.18", optional = true }
opus-decoder = { version = "0.1", optional = true }
rtrb = { version = "0.4", optional = true }

# Logging
tracing = "0.1"

# LZ4 compression/decompression for general data (the webdav and
# usbredir channels) and the display channel's tests. SPICE image
# LZ4 lives in shakenfist-spice-compression below. Not optional: the
# compression crate's `lz4` feature, always on here, pulls it in
# anyway, so gating it would save nothing.
lz4_flex = "0.14"

# Extracted SPICE codecs. Path+version dual-spec: cargo uses the
# path when building locally and the published crate when resolving
# from crates.io. Versions are kept in lockstep via
# cargo-release; see tools/cut-release.sh. Only the pure-Rust
# decoders the display channel always needs are named here; the C
# builds (H.264 encode and decode, mozjpeg) come in through this
# crate's `encoder`, `h264-decode` and `mozjpeg` features.
shakenfist-spice-compression = { path = "../shakenfist-spice-compression", version = "0.3.0", default-features = false, features = ["quic", "glz", "lz", "lz4", "jpeg"] }
shakenfist-spice-protocol = { path = "../shakenfist-spice-protocol", version = "0.3.0" }
# usbredir wire protocol, for the `usbredir` feature.
shakenfist-spice-usbredir = { path = "../shakenfist-spice-usbredir", version = "0.3.0", optional = true }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"

# CancellationToken for coordinated task shutdown (control socket)
tokio-util = "0.7"

# Control socket bind (control/server.rs)
socket2 = { version = "0.6", features = ["all"] }

# Zlib decompression for SPICE ZLIB_GLZ_RGB (type 107), used in
# the display channel
flate2 = "1"

# PNG encoding for the control socket's `screenshot` verb, and JPEG
# fixtures in the display channel's tests. SPICE JPEG decoding lives
# in `shakenfist-spice-compression`.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Base64 encoding for the control socket's `screenshot` verb (3e):
# image bytes (PNG or raw RGBA) are emitted as a base64 string in
# the NDJSON response.
base64 = "0.23"

# Visual digest decoder for the `digest-decode` feature.  Pulled
# in only when the test harness opts in; production builds carry
# no QR decoder.  `qr` enables the rqrr-backed RGBA→bytes path
# and the `decode()` parser; `serde` makes `Digest`/`Event` JSON-
# serialisable for the control-socket wire event.  See
# https://github.com/shakenfist/kerbside/blob/develop/docs/plans/PLAN-test-harness.md.
shakenfist-visual-digest = { version = "0.1.1", features = ["qr", "serde"], optional = true }

# WebDAV server (RFC 4918 handler with LocalFs backend), for the
# `webdav` feature.
dav-server = { version = "0.11", default-features = false, features = ["localfs"], optional = true }

# HTTP framing for WebDAV byte-stream transport, for the `webdav`
# feature.
hyper = { version = "1", features = ["http1", "server"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }

# Runtime metrics (src/metrics.rs) are the only libc consumer:
# sysconf(_SC_CLK_TCK) on Linux, and the Mach task/thread FFI on
# macOS. Both cfgs are needed — gating to Linux alone breaks the
# macOS build.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

# USB device access (pure Rust, no libusb), for the `usbredir`
# feature. Physical passthrough is Linux-only; see usb/mod.rs.
[target.'cfg(target_os = "linux")'.dependencies]
nusb = { version = "0.2", optional = true }

[dev-dependencies]
bytes = "1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

# Smoke-test that webrtc-rs's H.264 RTP payloader accepts the NAL
# output our H264Encoder produces.
# `rtp` was the standalone crate the umbrella `webrtc` crate
# re-exported as `webrtc::rtp` on 0.17; `webrtc` 0.20 replaced it
# with the sans-io `rtc` core (reached as `rtc::rtp`) and does not
# re-export that either, so this is now a dead upstream line ending
# at 0.17.2, kept only because this dev-dependency has no coupling
# to shakenfist-spice-webrtc's types. Used only by
# tests/webrtc_h264_smoke.rs; should move onto `rtc::rtp` (or be
# retired) eventually — see the webrtc-0.20-upgrade master plan's
# Future work.
rtp = "0.17"

# Both drive the H.264 encoder, so they only build with `encoder`.
# The other integration tests are discovered as usual.
[[test]]
name = "encoder_smoke"
path = "tests/encoder_smoke.rs"
required-features = ["encoder"]

[[test]]
name = "webrtc_h264_smoke"
path = "tests/webrtc_h264_smoke.rs"
required-features = ["encoder"]
