[package]
name = "shakenfist-spice-renderer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Shared SPICE rendering substrate for ryll: software framebuffer, channel handlers, session orchestration."
readme = "README.md"

[features]
# `audio` pulls in the cpal/opus/rtrb playback stack and the
# `channels::playback` module that depends on them.  Default-on
# so existing builds (GUI ryll, the loadtest before phase 6,
# CI lanes that did not opt out) keep their behaviour.
default = ["audio"]
audio = ["dep:cpal", "dep:opus-decoder", "dep:rtrb"]

# `digest-decode` enables QR-encoded visual-digest detection on
# the primary surface and emission of `digest_updated` events on
# the control socket.  Off by default: production ryll binaries
# do not carry the QR decoder.  Test-harness builds opt in via
# `cargo build --features digest-decode`.
digest-decode = ["dep:shakenfist-visual-digest"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
webpki-roots = "1.0"

# Binary protocol handling
bytes = "1"
byteorder = "1"

# Cryptography for SPICE auth
rsa = "0.9"
sha1 = "0.10"
rand = "0.8"

# Audio playback. A dedicated audio thread owns the cpal stream
# so it never needs to be Send. The rtrb ring buffer provides
# lock-free sample transfer from the tokio network task. All
# three live behind the default-on `audio` feature so a slim
# headless build (`--no-default-features`) does not link them.
cpal = { version = "0.18", optional = true }
opus-decoder = { version = "0.1", optional = true }
rtrb = { version = "0.3", optional = true }

# Logging
tracing = "0.1"

# LZ4 compression/decompression for general data (webdav, usbredir).
# SPICE image LZ4 lives in shakenfist-spice-compression below.
lz4_flex = "0.13"

# Extracted SPICE codecs. Path+version dual-spec: cargo uses the
# path when building locally and the published crate when resolving
# from crates.io. Versions are kept in lockstep via
# cargo-release; see tools/cut-release.sh.
shakenfist-spice-compression = { path = "../shakenfist-spice-compression", version = "0.1.5" }
shakenfist-spice-protocol = { path = "../shakenfist-spice-protocol", version = "0.1.5" }
shakenfist-spice-usbredir = { path = "../shakenfist-spice-usbredir", version = "0.1.5" }

# Serialisation
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Async channels
async-channel = "2"

# CancellationToken for coordinated task shutdown (control socket)
tokio-util = "0.7"

# TCP keepalive configuration (matches spice-gtk behaviour)
socket2 = { version = "0.6", features = ["all"] }

# USB device access (pure Rust, no libusb)
nusb = "0.2"

# Per-thread CPU metrics via sysconf(_SC_CLK_TCK) (Linux only)
libc = "0.2"

# Zlib decompression for SPICE ZLIB_GLZ_RGB (type 107), used in
# the display channel
flate2 = "1"

# JPEG decoding for SPICE JPEG image type. The `jpeg-decoder` crate
# has moved to `shakenfist-spice-compression` (phase 3 step 3A) where
# it backs `JpegDecoderRsDecoder`. The `image` crate is still needed
# for its own JPEG-adjacent uses elsewhere in the renderer, plus
# the `png` feature for the control socket's `screenshot` verb (3e).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Base64 encoding for the control socket's `screenshot` verb (3e):
# image bytes (PNG or raw RGBA) are emitted as a base64 string in
# the NDJSON response.
base64 = "0.22"

# H.264 encoding for the web frontend encoder pipeline (Phase 2+)
openh264 = "0.9"

# Visual digest decoder for the `digest-decode` feature.  Pulled
# in only when the test harness opts in; production builds carry
# no QR decoder.  `qr` enables the rqrr-backed RGBA→bytes path
# and the `decode()` parser; `serde` makes `Digest`/`Event` JSON-
# serialisable for the control-socket wire event.  See phase 6
# step 6c of the kerbside test-harness plan.
shakenfist-visual-digest = { git = "https://github.com/shakenfist/visual-digest-rust.git", features = ["qr", "serde"], optional = true }

# WebDAV server (RFC 4918 handler with LocalFs backend)
dav-server = { version = "0.11", default-features = false, features = ["localfs"] }

# HTTP framing for WebDAV byte-stream transport
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"

[dev-dependencies]
tempfile = "3"

# Phase 2 step 2e pre-flight: smoke-test that webrtc-rs's H.264
# RTP payloader accepts the NAL output our H264Encoder produces.
# `rtp` is the standalone crate that the umbrella `webrtc` crate
# re-exports as `webrtc::rtp`; depending on it directly keeps the
# test's transitive footprint minimal. Used only by
# tests/webrtc_h264_smoke.rs.
rtp = "0.17"
