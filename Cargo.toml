[workspace]
resolver = "2"
members = [
    "ryll",
    "shakenfist-spice-compression",
    "shakenfist-spice-protocol",
    "shakenfist-spice-renderer",
    "shakenfist-spice-usbredir",
    "shakenfist-spice-webrtc",
]

[workspace.lints.clippy]
unwrap_used = "warn"

[workspace.package]
version = "0.1.7"
edition = "2021"
# Fixed by `slice::as_chunks` in shakenfist-spice-compression, which
# clippy's `chunks_exact_to_as_chunks` lint requires over the older
# `chunks_exact`. Declared rather than left implicit so a too-old
# toolchain fails with cargo's MSRV error instead of a confusing
# "method not found" in a packaging lane.
rust-version = "1.88"
license = "Apache-2.0"
authors = ["Michael Still <mikal@stillhq.com>"]
repository = "https://github.com/shakenfist/ryll"
