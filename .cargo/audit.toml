# cargo-audit policy for ryll.
#
# This file mirrors the [advisories].ignore list in deny.toml so that
# `cargo audit` and `cargo deny check advisories` agree about which
# advisories we have explicitly accepted. Each entry in either file
# must have a matching rationale section in
# docs/plans/PLAN-supply-chain-followups.md.
#
# When you change one, update the other. The CI workflow runs both
# scanners and both must pass.

[advisories]
ignore = [
    # paste crate unmaintained. Drop-in `pastey` exists. See
    # PLAN-supply-chain-followups.md item 1.
    "RUSTSEC-2024-0436",

    # rsa Marvin timing attack. No fixed version in the ecosystem.
    # See PLAN-supply-chain-followups.md item 2.
    "RUSTSEC-2023-0071",

    # rustls-pemfile unmaintained (upstream archived). Migration to
    # rustls-pki-types PemObject required. See
    # PLAN-supply-chain-followups.md item 3.
    "RUSTSEC-2025-0134",

    # ttf-parser unmaintained; transitive via egui's font stack
    # (ab_glyph -> owned_ttf_parser). Nothing to change until egui
    # migrates. See PLAN-supply-chain-followups.md item 4.
    "RUSTSEC-2026-0192",
]
